<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Домкнига — Сбережения</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f6fa;
      --card: #fff;
      --text: #172033;
      --muted: #7b8496;
      --line: #e7eaf2;

      --accent: #5f6c85;
      --accent-soft: rgba(95, 108, 133, .10);

      --green: #00b894;
      --amber: #e6a700;
      --amber-text: #8a5a00;
      --red: #ff6b6b;

      --green-bg: rgba(0, 184, 148, .10);
      --amber-bg: rgba(230, 167, 0, .12);
      --red-bg: rgba(255, 107, 107, .10);

      --shadow: 0 10px 28px rgba(0, 0, 0, .04);
      --radius: 16px;

      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0f1220;
      --card: #191e30;
      --text: #eef0ff;
      --muted: #8b93ad;
      --line: #262d45;

      --accent: #8b9bb4;
      --accent-soft: rgba(139, 155, 180, .12);

      --green: #2ee6c0;
      --amber: #ffd93d;
      --amber-text: #ffd93d;
      --red: #ff8080;

      --green-bg: rgba(46, 230, 192, .12);
      --amber-bg: rgba(255, 217, 61, .12);
      --red-bg: rgba(255, 128, 128, .12);

      --shadow: 0 10px 28px rgba(0, 0, 0, .20);

      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: start center;
      min-height: 100dvh;
      padding:
        max(24px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      transition: background .2s, color .2s;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }

    .stage {
      width: 100%;
      max-width: 760px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand b {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .15s, transform .1s;
    }

    .icon-btn:active {
      transform: scale(.96);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      container-type: inline-size;
      container-name: card;

      --fs-2xs: 10px;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 15px;
      --fs-lg: 17px;
    }

    @supports (width: 1cqi) {
      .card {
        --fs-2xs: clamp(9px, 1.8cqi, 12px);
        --fs-xs: clamp(11px, 2.2cqi, 14px);
        --fs-sm: clamp(11px, 2.4cqi, 15px);
        --fs-md: clamp(13px, 2.8cqi, 18px);
        --fs-lg: clamp(15px, 3.2cqi, 21px);
      }
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      font-size: var(--fs-lg);
      font-weight: 800;
      letter-spacing: -.2px;
      white-space: nowrap;
    }

    .section-note {
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 800;
      white-space: nowrap;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .ring-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      flex: 0 0 auto;
    }

    .ring {
      width: 100%;
      height: 100%;
      display: block;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--line);
      stroke-width: 12;
    }

    .ring-fill {
      fill: none;
      stroke: var(--tone, var(--accent));
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset .6s cubic-bezier(.22, .61, .36, 1), stroke .3s;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      padding: 18%;
    }

    .rc-pct {
      font-size: 26px;
      font-size: clamp(22px, 7cqi, 30px);
      font-weight: 800;
      letter-spacing: -.8px;
      color: var(--tone, var(--accent));
    }

    .rc-k {
      font-size: var(--fs-2xs);
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .rc-done {
      font-size: 30px;
      line-height: 1;
      color: var(--green);
    }

    .info {
      flex: 1;
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .due-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .due-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .due-k {
      font-size: var(--fs-2xs);
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .due-sub {
      font-size: var(--fs-2xs);
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      text-align: right;
    }

    .due-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .due-v {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 26px;
      font-size: clamp(22px, 7cqi, 30px);
      font-weight: 800;
      letter-spacing: -.7px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .due-v.t-red { color: var(--red); }
    .due-v.t-green { color: var(--green); }
    .due-v.t-amber { color: var(--amber-text); }

    .badge {
      flex: 0 0 auto;
      font-size: var(--fs-2xs);
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge.paid,
    .badge.fast {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge.long {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .badge.plan {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.normal,
    .badge.none {
      background: var(--bg);
      color: var(--muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .metric-head {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .metric .ic {
      width: 13px;
      height: 13px;
      font-size: 13px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .metric .mk {
      font-size: var(--fs-2xs);
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric .mv {
      font-size: var(--fs-sm);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .goals {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .pane-title {
      font-size: var(--fs-sm);
      font-weight: 800;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pane-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .pane-count {
      font-size: var(--fs-2xs);
      font-weight: 800;
      color: var(--muted);
      background: var(--bg);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .goal-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .goal-row {
      width: 100%;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
      font: inherit;
      transition: background .15s, border-color .15s, transform .1s;
    }

    .goal-row:hover {
      background: var(--bg);
    }

    .goal-row:active {
      transform: scale(.995);
    }

    .goal-row.on {
      background: var(--bg);
      border-color: var(--line);
    }

    .g-ic {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .goal-row.on .g-ic {
      color: var(--text);
    }

    .g-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .g-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .g-name {
      font-weight: 800;
      font-size: var(--fs-sm);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .g-pct {
      font-weight: 800;
      font-size: var(--fs-xs);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: 999px;
      transition: width .45s cubic-bezier(.22, .61, .36, 1);
    }

    .g-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      color: var(--muted);
      font-size: var(--fs-2xs);
      font-weight: 700;
    }

    .g-sum {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .g-account {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      max-width: 45%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .g-account .ic {
      width: 12px;
      height: 12px;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .g-account span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .piggy {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .mode-seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
      flex: 0 0 auto;
    }

    .mode-seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s, box-shadow .15s;
    }

    .mode-seg button.on {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
    }

    .pig-body {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      column-gap: 16px;
      align-items: stretch;
      min-height: 240px;
    }

    .pie-zone {
      position: relative;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pie-stage {
      position: relative;
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    .pie-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .seg {
      cursor: pointer;
      transform-box: view-box;
      transform-origin: 50% 50%;
      transition:
        transform .26s cubic-bezier(.2, .8, .2, 1),
        opacity .22s,
        filter .22s;
    }

    .seg.dim {
      opacity: .35;
    }

    .seg.sel {
      transform: scale(1.06);
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .22));
    }

    .hole {
      cursor: pointer;
    }

    .pie-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
      padding: 24%;
      transition: opacity .14s ease;
      line-height: 1.08;
    }

    .pie-center.fade {
      opacity: 0;
    }

    .pie-center > div {
      width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .pc-name {
      color: var(--muted);
      font-size: var(--fs-2xs);
      font-weight: 800;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
      word-break: break-word;
    }

    .pc-sum {
      display: block;
      font-size: clamp(12px, 3.8cqi, 17px);
      font-weight: 800;
      letter-spacing: -.3px;
      white-space: nowrap;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pc-sub {
      display: block;
      color: var(--muted);
      font-size: var(--fs-2xs);
      margin-top: 1px;
      font-weight: 700;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
      word-break: break-word;
    }

    .ic-lg {
      width: clamp(18px, 5.2cqi, 26px);
      height: clamp(18px, 5.2cqi, 26px);
      font-size: clamp(16px, 4.6cqi, 24px);
    }

    .pig-list {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .pig-row {
      display: grid;
      grid-template-columns: 10px 18px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 0;
      border-left: 3px solid transparent;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 9px;
      cursor: pointer;
      font: inherit;
      font-size: var(--fs-xs);
      transition: background .15s, border-color .15s, transform .1s;
    }

    .pig-row:hover {
      background: var(--bg);
    }

    .pig-row:active {
      transform: scale(.99);
    }

    .pig-row .dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex: 0 0 auto;
    }

    .pig-row .ic {
      color: var(--muted);
    }

    .pig-row.on .ic {
      color: var(--text);
    }

    .pig-row .nm {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .pig-row .amt {
      color: var(--muted);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .pig-row .pc {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 38px;
      text-align: right;
      white-space: nowrap;
    }

    .pig-row.on {
      background: var(--accent-soft);
      font-weight: 800;
    }

    .pig-empty {
      padding: 18px 2px;
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-align: center;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: var(--fs-2xs);
      text-align: center;
      font-weight: 700;
    }

    .mini-btn {
      flex: 1 1 auto;
      justify-content: center;
      min-width: 0;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: var(--fs-xs);
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background .15s, transform .1s, border-color .15s, color .15s;
    }

    .mini-btn:active {
      transform: scale(.98);
    }

    .mini-btn .ic {
      color: var(--muted);
    }

    .mini-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    .mini-btn.primary .ic {
      color: rgba(255, 255, 255, .86);
    }

    .mini-btn.primary:hover {
      filter: brightness(1.06);
    }

    .pane-actions .mini-btn {
      flex: 0 0 auto;
      height: 30px;
      border-radius: 9px;
      font-size: 10px;
      gap: 6px;
      padding: 0 10px;
    }

    .btn-t {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ====== МОДАЛКА ====== */

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 18, 32, .40);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(20px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(20px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
      animation: fade .2s;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      width: 100%;
      max-width: 420px;
      max-height: calc(100dvh - 40px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .15);
      animation: rise .25s cubic-bezier(.16, 1, .3, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.98);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .m-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--bg) 0%, var(--card) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 0 0 auto;
    }

    .m-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.2px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .m-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 18px;
      transition: background .15s;
      flex: 0 0 auto;
    }

    .m-close:hover {
      background: var(--bg);
      color: var(--text);
    }

    .m-body {
      padding: 18px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .form-grid {
      display: grid;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .35px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .field input,
    .field select {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 0 10px;
      outline: none;
      transition: border-color .15s, background .15s;
      min-width: 0;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      background: var(--card);
    }

    .field input.invalid,
    .field select.invalid {
      border-color: var(--red);
      background: var(--red-bg);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-width: 0;
    }

    .form-foot {
      display: flex;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      flex: 0 0 auto;
    }

    .form-foot .mini-btn {
      flex: 1;
      justify-content: center;
      height: 40px;
      border-radius: 10px;
    }

    .ic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 15px;
      line-height: 1;
      color: currentColor;
      vertical-align: middle;
      flex: 0 0 auto;
      overflow: visible;
    }

    .ic.loaded {
      background-color: currentColor;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .badge .ic {
      width: 13px;
      height: 13px;
      font-size: 13px;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(14px);
      background: var(--text);
      color: var(--card);
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .22s;
      z-index: 150;
      white-space: nowrap;
      max-width: min(90vw, 420px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 620px) {
      .hero {
        flex-direction: row;
        align-items: center;
        gap: 18px;
      }

      .ring-wrap {
        width: 128px;
        height: 128px;
      }

      .info {
        width: auto;
      }
    }

    @media (max-width: 620px) {
      .pig-body {
        grid-template-columns: 1fr;
        row-gap: 14px;
        min-height: 0;
      }

      .pig-list {
        justify-content: flex-start;
      }

      .pie-stage {
        max-width: 260px;
      }

      .pie-center {
        padding: 23%;
      }
    }

    @media (max-width: 430px) {
      .metrics {
        grid-template-columns: 1fr 1fr;
      }

      .metric:last-child {
        grid-column: 1 / -1;
      }

      .g-sub {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }

      .g-account {
        max-width: 100%;
      }

      .field-row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="topline">
      <div class="brand">
        <b>Домкнига</b>
        <span>· сбережения</span>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="hideBtn" type="button" aria-label="Скрыть суммы" aria-pressed="false" title="Скрыть суммы">🙈</button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Переключить тему" title="Тема">◐</button>
      </div>
    </div>

    <section class="card">
      <div class="section-head">
        <h2 class="section-title">Финансовые цели</h2>
        <div class="section-note" id="goalsSummary">—</div>
      </div>

      <div class="hero">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center" id="ringCenter"></div>
        </div>

        <div class="info" id="info"></div>
      </div>

      <div class="goals">
        <div class="pane-head">
          <span class="pane-title">Прогресс по целям</span>

          <div class="pane-actions">
            <span class="pane-count" id="goalsCount"></span>

            <button class="mini-btn primary" id="addGoalBtn" type="button">
              <i class="ic" data-ic="lucide:plus" data-glyph="+"></i>
              <span class="btn-t">Добавить цель</span>
            </button>
          </div>
        </div>

        <div class="goal-list" id="goalList"></div>
      </div>

      <div class="piggy">
        <div class="pane-head">
          <span class="pane-title" id="pigTitle">Копилки: распределение по счетам</span>

          <div class="mode-seg" id="pigMode" role="group" aria-label="Разрез диаграммы">
            <button type="button" data-mode="accounts" class="on" aria-pressed="true">Счета</button>
            <button type="button" data-mode="goals" aria-pressed="false">Цели</button>
          </div>
        </div>

        <div class="pig-body">
          <div class="pie-zone">
            <div class="pie-stage">
              <svg class="pie-svg" id="pigSvg" viewBox="0 0 300 300" role="img" aria-label="Диаграмма накоплений"></svg>
              <div class="pie-center" id="pigCenter"></div>
            </div>
          </div>

          <div class="pig-list" id="pigList"></div>
        </div>

        <div class="hint">
          нажми на цель или сегмент — выбранная сущность подсветится в списке и на диаграмме
        </div>
      </div>
    </section>
  </div>

  <div class="backdrop" id="backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="modal"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="srStatus" class="sr-only" aria-live="polite"></div>

  <script>
    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

    const NS = 'http://www.w3.org/2000/svg';

    const numberFormatter = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
    const fmt = n => numberFormatter.format(Math.round(Number(n) || 0));

    const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function plural(n, forms) {
      const abs = Math.abs(n);
      const n10 = abs % 10;
      const n100 = abs % 100;

      if (n10 === 1 && n100 !== 11) return forms[0];
      if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
      return forms[2];
    }

    function storeGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (_) {
        return null;
      }
    }

    function storeSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (_) {}
    }

    /* ====== ICONIFY WITH REDUNDANCY ====== */

    const ICON_HOSTS = [
      'https://api.iconify.design',
      'https://api.simplesvg.com',
      'https://api.unisvg.com'
    ];

    const iconCache = new Map();
    const iconPromises = new Map();

    function iconPath(name) {
      const [prefix, ...rest] = name.split(':');
      return `${prefix}/${rest.join(':')}.svg`;
    }

    function probeImage(url, timeout = 750) {
      return new Promise(resolve => {
        const img = new Image();
        let settled = false;

        const finish = ok => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (!ok) img.src = '';
          resolve(ok);
        };

        const timer = setTimeout(() => finish(false), timeout);

        img.onload = () => finish(true);
        img.onerror = () => finish(false);
        img.src = url;
      });
    }

    function resolveIconUrl(name) {
      const cached = iconCache.get(name);
      if (cached) return Promise.resolve(cached.url);

      let promise = iconPromises.get(name);
      if (promise) return promise;

      promise = (async () => {
        const path = iconPath(name);

        for (const host of ICON_HOSTS) {
          const url = `${host}/${path}`;
          const ok = await probeImage(url);
          if (ok) {
            iconCache.set(name, { status: 'ok', url });
            return url;
          }
        }

        iconCache.set(name, { status: 'fail', url: null });
        return null;
      })();

      iconPromises.set(name, promise);
      promise.finally(() => iconPromises.delete(name));

      return promise;
    }

    function applyIcon(el, url, color) {
      if (!url) return;
      el.classList.add('loaded');
      el.style.webkitMaskImage = `url("${url}")`;
      el.style.maskImage = `url("${url}")`;
      el.style.backgroundColor = color || '';
      el.textContent = '';
      el.dataset.state = 'ok';
    }

    function applyFallback(el, glyph) {
      el.classList.remove('loaded');
      el.style.webkitMaskImage = '';
      el.style.maskImage = '';
      el.style.backgroundColor = '';
      el.textContent = glyph || '•';
      el.dataset.state = 'fail';
    }

    function setIcon(el, iconName, glyph, color) {
      if (!el) return;

      el.dataset.ic = iconName;
      el.dataset.glyph = glyph || '';

      if (color) el.dataset.color = color;
      else delete el.dataset.color;

      if (el.dataset.state === 'ok') {
        const cached = iconCache.get(iconName);
        if (cached?.url) {
          applyIcon(el, cached.url, el.dataset.color);
          return;
        }
      }

      if (el.dataset.state === 'fail') {
        applyFallback(el, el.dataset.glyph);
        return;
      }

      if (el.dataset.state === 'pending') return;

      el.dataset.state = 'pending';
      el.textContent = el.dataset.glyph || '';

      resolveIconUrl(iconName)
        .then(url => {
          if (url) applyIcon(el, url, el.dataset.color);
          else applyFallback(el, el.dataset.glyph);
        })
        .catch(() => applyFallback(el, el.dataset.glyph));
    }

    function hydrateIcons(root = document) {
      $$('.ic[data-ic]', root).forEach(el => {
        setIcon(el, el.dataset.ic, el.dataset.glyph, el.dataset.color || undefined);
      });
    }

    /* ====== DATA ====== */

    const ACCOUNTS = [
      {
        id: 'cash',
        name: 'Наличные',
        icon: 'lucide:banknote',
        emoji: '💵',
        color: '#00b894',
        type: 'cash'
      },
      {
        id: 'salary',
        name: 'Зарплатная карта',
        icon: 'lucide:credit-card',
        emoji: '💳',
        color: '#5f6c85',
        type: 'card'
      },
      {
        id: 'family',
        name: 'Семейная карта',
        icon: 'lucide:users',
        emoji: '👨‍👩‍👧',
        color: '#0984e3',
        type: 'card'
      },
      {
        id: 'invest',
        name: 'Инвестиционный счет',
        icon: 'lucide:trending-up',
        emoji: '📈',
        color: '#a29bfe',
        type: 'card'
      },
      {
        id: 'cashback',
        name: 'Кэшбэк-карта',
        icon: 'lucide:badge-percent',
        emoji: '💰',
        color: '#fdcb6e',
        type: 'card'
      }
    ];

    const accountById = Object.fromEntries(ACCOUNTS.map(a => [a.id, a]));

    const GOAL_COLORS = [
      '#6c5ce7',
      '#00b894',
      '#e17055',
      '#0984e3',
      '#fd79a8',
      '#00cec9',
      '#fdcb6e',
      '#ff7675'
    ];

    let goalColorIdx = 0;

    const GOALS = [
      {
        id: 'car',
        name: 'Машина',
        icon: 'lucide:car',
        emoji: '🚗',
        color: GOAL_COLORS[goalColorIdx++ % GOAL_COLORS.length],
        target: 1200000,
        saved: 480000,
        accountId: 'salary'
      },
      {
        id: 'emergency',
        name: 'Подушка безопасности',
        icon: 'lucide:shield-check',
        emoji: '🛡️',
        color: GOAL_COLORS[goalColorIdx++ % GOAL_COLORS.length],
        target: 600000,
        saved: 520000,
        accountId: 'cash'
      },
      {
        id: 'vacation',
        name: 'Отпуск',
        icon: 'lucide:plane',
        emoji: '✈️',
        color: GOAL_COLORS[goalColorIdx++ % GOAL_COLORS.length],
        target: 350000,
        saved: 190000,
        accountId: 'family'
      },
      {
        id: 'repair',
        name: 'Ремонт',
        icon: 'lucide:hammer',
        emoji: '🔨',
        color: GOAL_COLORS[goalColorIdx++ % GOAL_COLORS.length],
        target: 450000,
        saved: 95000,
        accountId: 'cashback'
      },
      {
        id: 'education',
        name: 'Обучение',
        icon: 'lucide:graduation-cap',
        emoji: '🎓',
        color: GOAL_COLORS[goalColorIdx++ % GOAL_COLORS.length],
        target: 180000,
        saved: 120000,
        accountId: 'invest'
      }
    ];

    const goalById = Object.fromEntries(GOALS.map(g => [g.id, g]));

    /* ====== STATE ====== */

    const state = {
      hidden: storeGet('domkniga-savings-hidden') === '1',
      mode: 'accounts',
      selectedGoal: null,
      selectedSegment: null
    };

    function money(n) {
      if (state.hidden) return '•••';
      return `${fmt(n)} ₽`;
    }

    /* ====== CALCULATIONS ====== */

    function goalMeta(g) {
      const remaining = Math.max(0, g.target - g.saved);
      const percent = g.target > 0 ? Math.min(100, (g.saved / g.target) * 100) : 0;

      let status;
      if (remaining <= 0) status = 'done';
      else if (percent >= 80) status = 'almost';
      else status = 'progress';

      return { remaining, percent, status };
    }

    function overall() {
      const saved = GOALS.reduce((sum, g) => sum + Math.max(0, g.saved), 0);
      const target = GOALS.reduce((sum, g) => sum + Math.max(0, g.target), 0);
      const remaining = Math.max(0, target - saved);
      const percent = target > 0 ? Math.min(100, (saved / target) * 100) : 0;

      return { saved, target, remaining, percent };
    }

    function overallStatus(O) {
      if (O.remaining <= 0) return { key: 'paid', txt: 'накоплено', tone: 'paid' };
      if (O.percent >= 80) return { key: 'fast', txt: 'почти', tone: 'fast' };
      return { key: 'plan', txt: 'в процессе', tone: 'plan' };
    }

    /* ====== HERO RENDER ====== */

    const C = 2 * Math.PI * 52;

    const ringTone = t =>
      t === 'paid' || t === 'fast' ? 'var(--green)' :
      t === 'long' ? 'var(--amber)' :
      'var(--accent)';

    function renderHero() {
      const O = overall();
      const S = overallStatus(O);

      const tv = ringTone(S.tone);
      const fill = $('#ringFill');

      fill.style.setProperty('--tone', tv);
      fill.style.strokeDasharray = C;
      fill.style.strokeDashoffset = C * (1 - O.percent / 100);

      $('#ringCenter').innerHTML = S.key === 'paid'
        ? `<span class="rc-done" aria-hidden="true">✓</span><span class="rc-k">накоплено</span>`
        : `<span class="rc-pct" style="--tone:${tv}">${Math.round(O.percent)}%</span><span class="rc-k">от цели</span>`;

      const bIcon =
        S.key === 'paid' ? 'lucide:check' :
        S.key === 'fast' ? 'lucide:sparkles' :
        'lucide:target';

      const bGlyph =
        S.key === 'paid' ? '✓' :
        S.key === 'fast' ? '✨' :
        '◎';

      const sub = O.remaining <= 0
        ? 'все цели достигнуты'
        : `осталось ${money(O.remaining)}`;

      const dueVal = O.remaining <= 0 ? '0 ₽' : money(O.remaining);
      const dueTone =
        S.key === 'paid' ? 't-green' :
        S.key === 'fast' ? '' :
        '';

      $('#goalsSummary').textContent = `${GOALS.length} ${plural(GOALS.length, ['цель', 'цели', 'целей'])}`;

      $('#info').innerHTML = `
        <div class="due-row">
          <div class="due-top">
            <span class="due-k">Осталось накопить</span>
            <span class="due-sub">${esc(sub)}</span>
          </div>
          <div class="due-bottom">
            <span class="due-v ${dueTone}">${esc(dueVal)}</span>
            <span class="badge ${esc(S.key)}">
              <i class="ic" data-ic="${esc(bIcon)}" data-glyph="${esc(bGlyph)}"></i>${esc(S.txt)}
            </span>
          </div>
        </div>
        <div class="metrics">
          <div class="metric">
            <div class="metric-head">
              <i class="ic" data-ic="lucide:piggy-bank" data-glyph="🐷"></i>
              <span class="mk">Накоплено</span>
            </div>
            <span class="mv">${esc(money(O.saved))}</span>
          </div>
          <div class="metric">
            <div class="metric-head">
              <i class="ic" data-ic="lucide:target" data-glyph="◎"></i>
              <span class="mk">Цель</span>
            </div>
            <span class="mv">${esc(money(O.target))}</span>
          </div>
          <div class="metric">
            <div class="metric-head">
              <i class="ic" data-ic="lucide:hourglass" data-glyph="⏳"></i>
              <span class="mk">Осталось</span>
            </div>
            <span class="mv">${esc(money(O.remaining))}</span>
          </div>
        </div>
      `;

      hydrateIcons($('#info'));
    }

    /* ====== GOALS RENDER ====== */

    function renderGoals() {
      const displayGoals = [...GOALS].sort((a, b) => {
        const ma = goalMeta(a);
        const mb = goalMeta(b);

        if (ma.remaining <= 0 && mb.remaining > 0) return -1;
        if (mb.remaining <= 0 && ma.remaining > 0) return 1;

        if (ma.percent !== mb.percent) return mb.percent - ma.percent;
        return b.saved - a.saved;
      });

      const activeCount = displayGoals.filter(g => goalMeta(g).remaining > 0).length;

      $('#goalsCount').textContent = activeCount
        ? `${activeCount} ${plural(activeCount, ['цель', 'цели', 'целей'])} в работе`
        : 'все цели закрыты';

      $('#goalList').innerHTML = displayGoals.map(g => {
        const m = goalMeta(g);
        const acc = accountById[g.accountId] || { name: 'Без счета', icon: 'lucide:circle-slash', emoji: '∅', color: '#b2bec3' };
        const on = state.selectedGoal === g.id;

        return `
          <button
            type="button"
            class="goal-row${on ? ' on' : ''}"
            data-goal="${esc(g.id)}"
            aria-pressed="${on ? 'true' : 'false'}"
            aria-label="Цель ${esc(g.name)}, накоплено ${Math.round(m.percent)} процентов, счет ${esc(acc.name)}"
          >
            <span class="g-ic">
              <i class="ic" data-ic="${esc(g.icon)}" data-glyph="${esc(g.emoji)}"></i>
            </span>

            <span class="g-main">
              <span class="g-top">
                <span class="g-name">${esc(g.name)}</span>
                <span class="g-pct">${Math.round(m.percent)}%</span>
              </span>

              <span class="bar" aria-hidden="true">
                <span class="bar-fill" style="width:${m.percent}%; background:${esc(g.color)}"></span>
              </span>

              <span class="g-sub">
                <span class="g-sum">${esc(money(g.saved))} из ${esc(money(g.target))}</span>
                <span class="g-account">
                  <i class="ic" data-ic="${esc(acc.icon)}" data-glyph="${esc(acc.emoji)}"></i>
                  <span>${esc(acc.name)}</span>
                </span>
              </span>
            </span>
          </button>
        `;
      }).join('');

      hydrateIcons($('#goalList'));
    }

    /* ====== PIGGY CHART ====== */

    const CX = 150;
    const CY = 150;
    const R = 134;
    const RI = 80;
    const GAP = 1.2;

    const rad = deg => (deg - 90) * Math.PI / 180;
    const pt = (ang, r) => [CX + r * Math.cos(rad(ang)), CY + r * Math.sin(rad(ang))];

    function arcPath(a0, a1, rOut, rIn) {
      a0 += GAP / 2;
      a1 -= GAP / 2;
      if (a1 <= a0) a1 = a0 + 0.01;

      const [x0, y0] = pt(a0, rOut);
      const [x1, y1] = pt(a1, rOut);
      const [x2, y2] = pt(a1, rIn);
      const [x3, y3] = pt(a0, rIn);

      const large = (a1 - a0) > 180 ? 1 : 0;

      return `M${x0} ${y0}A${rOut} ${rOut} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${rIn} ${rIn} 0 ${large} 0 ${x3} ${y3}Z`;
    }

    function getPigData() {
      const O = overall();

      if (state.mode === 'goals') {
        const items = GOALS
          .map(g => ({
            id: g.id,
            name: g.name,
            icon: g.icon,
            emoji: g.emoji,
            color: g.color,
            value: Math.max(0, g.saved),
            accountId: g.accountId
          }))
          .filter(x => x.value > 0);

        return {
          items,
          total: O.saved,
          meta: {
            type: 'total',
            name: 'Все цели',
            icon: 'lucide:targets',
            emoji: '🎯',
            value: O.saved
          }
        };
      }

      const byAccount = {};

      ACCOUNTS.forEach(a => {
        byAccount[a.id] = 0;
      });

      GOALS.forEach(g => {
        if (!byAccount[g.accountId]) byAccount[g.accountId] = 0;
        byAccount[g.accountId] += Math.max(0, g.saved);
      });

      const items = ACCOUNTS
        .map(a => ({
          id: a.id,
          name: a.name,
          icon: a.icon,
          emoji: a.emoji,
          color: a.color,
          value: byAccount[a.id] || 0,
          type: a.type
        }))
        .filter(x => x.value > 0);

      return {
        items,
        total: O.saved,
        meta: {
          type: 'total',
          name: 'Все счета',
          icon: 'lucide:wallet',
          emoji: '👛',
          value: O.saved
        }
      };
    }

    function buildPigSegments(data) {
      const sorted = [...data.items].sort((a, b) => b.value - a.value);
      const total = sorted.reduce((sum, x) => sum + x.value, 0);

      if (total <= 0) return [];

      let acc = 0;

      return sorted.map(s => {
        const sweep = (s.value / total) * 360;
        const start = acc;
        const end = acc + sweep;
        acc = end;

        return {
          ...s,
          start,
          end,
          percent: (s.value / total) * 100
        };
      });
    }

    let pigSegEls = {};

    function buildPigRing(segments) {
      const svg = $('#pigSvg');
      svg.innerHTML = '';
      pigSegEls = {};

      segments.forEach(s => {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', arcPath(s.start, s.end, R, RI));
        p.setAttribute('fill', s.color);
        p.setAttribute('class', 'seg');
        p.dataset.id = s.id;
        svg.appendChild(p);
        pigSegEls[s.id] = p;
      });

      const hole = document.createElementNS(NS, 'circle');
      hole.setAttribute('cx', CX);
      hole.setAttribute('cy', CY);
      hole.setAttribute('r', RI - 2);
      hole.setAttribute('fill', 'transparent');
      hole.setAttribute('class', 'hole');
      svg.appendChild(hole);

      updatePigSelection(segments);
    }

    function updatePigSelection(segments) {
      segments.forEach(s => {
        const el = pigSegEls[s.id];
        if (!el) return;
        el.classList.toggle('sel', state.selectedSegment === s.id);
        el.classList.toggle('dim', !!state.selectedSegment && state.selectedSegment !== s.id);
      });
    }

    let pigCenterTimer = 0;

    function renderPigCenterContent(segments, data) {
      const c = $('#pigCenter');
      const active = segments.find(s => s.id === state.selectedSegment);

      if (active) {
        let sub = '';

        if (state.mode === 'goals' && active.accountId) {
          const acc = accountById[active.accountId];
          if (acc) sub = acc.name;
        }

        c.innerHTML = `
          <div>
            <span class="ic ic-lg" id="pigCenterIc"></span>
            <div class="pc-name">${esc(active.name)}</div>
            <span class="pc-sum">${esc(money(active.value))}</span>
            <span class="pc-sub">${Math.round(active.percent)}%${sub ? ' · ' + esc(sub) : ''}</span>
          </div>
        `;

        setIcon($('#pigCenterIc'), active.icon, active.emoji, active.color);
        return;
      }

      const sub = state.mode === 'goals' ? 'по целям' : 'по счетам';

      c.innerHTML = `
        <div>
          <span class="ic ic-lg" id="pigCenterIc"></span>
          <div class="pc-name">${esc(data.meta.name)}</div>
          <span class="pc-sum">${esc(money(data.meta.value))}</span>
          <span class="pc-sub">${esc(sub)}</span>
        </div>
      `;

      setIcon($('#pigCenterIc'), data.meta.icon, data.meta.emoji);
    }

    function updatePigCenter(segments, data) {
      const c = $('#pigCenter');
      c.classList.add('fade');

      clearTimeout(pigCenterTimer);
      pigCenterTimer = setTimeout(() => {
        renderPigCenterContent(segments, data);
        c.classList.remove('fade');
      }, reduced() ? 0 : 120);
    }

    function renderPigList(segments) {
      const list = $('#pigList');

      if (!segments.length) {
        list.innerHTML = `<div class="pig-empty">Нет накоплений для отображения</div>`;
        return;
      }

      list.innerHTML = segments.map(s => {
        const on = state.selectedSegment === s.id;

        return `
          <button
            type="button"
            class="pig-row${on ? ' on' : ''}"
            data-id="${esc(s.id)}"
            aria-pressed="${on ? 'true' : 'false'}"
          >
            <i class="dot" style="background:${esc(s.color)}"></i>
            <i class="ic" data-ic="${esc(s.icon)}" data-glyph="${esc(s.emoji)}"></i>
            <span class="nm">${esc(s.name)}</span>
            <span class="amt">${esc(money(s.value))}</span>
            <span class="pc">${Math.round(s.percent)}%</span>
          </button>
        `;
      }).join('');

      hydrateIcons(list);
    }

    function renderPiggy() {
      const data = getPigData();
      const segments = buildPigSegments(data);

      if (state.selectedSegment && !segments.some(s => s.id === state.selectedSegment)) {
        state.selectedSegment = null;
      }

      let title = 'Копилки: распределение по счетам';

      if (state.mode === 'goals') {
        if (state.selectedGoal && goalById[state.selectedGoal]) {
          title = `Копилки: цель «${goalById[state.selectedGoal].name}»`;
        } else {
          title = 'Копилки: распределение по целям';
        }
      } else {
        title = 'Копилки: распределение по счетам';
      }

      $('#pigTitle').textContent = title;

      $$('#pigMode button').forEach(btn => {
        const on = btn.dataset.mode === state.mode;
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      buildPigRing(segments);
      updatePigCenter(segments, data);
      renderPigList(segments);
    }

    /* ====== RENDER ALL ====== */

    function setStatus(text) {
      const sr = $('#srStatus');
      if (sr) sr.textContent = text;
    }

    function renderAll() {
      renderHero();
      renderGoals();
      renderPiggy();
      hydrateIcons(document);
    }

    /* ====== EVENTS: GOALS ====== */

    $('#goalList').addEventListener('click', e => {
      const row = e.target.closest('[data-goal]');
      if (!row) return;

      const id = row.dataset.goal;

      if (state.selectedGoal === id) {
        state.selectedGoal = null;
        state.selectedSegment = null;
        setStatus('Выбор цели сброшен');
      } else {
        state.selectedGoal = id;
        state.mode = 'goals';
        state.selectedSegment = id;
        setStatus(`Выбрана цель ${goalById[id]?.name || id}`);
      }

      haptic('light');
      renderAll();
    });

    /* ====== EVENTS: PIGGY ====== */

    $('#pigMode').addEventListener('click', e => {
      const btn = e.target.closest('[data-mode]');
      if (!btn) return;

      const next = btn.dataset.mode;
      if (next === state.mode) return;

      state.mode = next;

      if (state.mode === 'goals' && state.selectedGoal) {
        state.selectedSegment = state.selectedGoal;
      } else {
        state.selectedSegment = null;
      }

      haptic('light');
      renderAll();
    });

    $('#pigSvg').addEventListener('click', e => {
      const seg = e.target.closest('.seg');

      if (seg) {
        toggleSegment(seg.dataset.id);
        return;
      }

      if (e.target.classList.contains('hole')) {
        state.selectedSegment = null;
        if (state.mode === 'goals') state.selectedGoal = null;
        haptic('light');
        renderAll();
      }
    });

    $('#pigList').addEventListener('click', e => {
      const row = e.target.closest('[data-id]');
      if (!row) return;

      toggleSegment(row.dataset.id);
    });

    function toggleSegment(id) {
      if (state.mode === 'goals') {
        if (state.selectedSegment === id) {
          state.selectedSegment = null;
          state.selectedGoal = null;
          setStatus('Выбор цели сброшен');
        } else {
          state.selectedSegment = id;
          state.selectedGoal = id;
          setStatus(`Выбрана цель ${goalById[id]?.name || id}`);
        }
      } else {
        state.selectedSegment = state.selectedSegment === id ? null : id;
        setStatus(state.selectedSegment ? 'Сегмент диаграммы выбран' : 'Выбор сегмента сброшен');
      }

      haptic('light');
      renderAll();
    }

    /* ====== TOAST / HAPTIC ====== */

    function toast(text) {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('show');

      clearTimeout(window.__tt);
      window.__tt = setTimeout(() => el.classList.remove('show'), 1900);
    }

    function haptic(type = 'light') {
      try {
        const tg = window.Telegram?.WebApp;

        if (tg?.HapticFeedback) {
          if (type === 'success') {
            tg.HapticFeedback.notificationOccurred('success');
          } else if (type === 'error') {
            tg.HapticFeedback.notificationOccurred('error');
          } else {
            tg.HapticFeedback.impactOccurred(type === 'light' ? 'light' : type);
          }
          return;
        }
      } catch (_) {}

      if (navigator.vibrate) {
        navigator.vibrate(type === 'success' ? 20 : type === 'error' ? 30 : 10);
      }
    }

    /* ====== THEME ====== */

    const tg = window.Telegram?.WebApp;

    function currentTheme() {
      return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    }

    function syncTelegramChrome() {
      if (!tg) return;

      const dark = currentTheme() === 'dark';
      const bg = dark ? '#0f1220' : '#f5f6fa';

      try {
        tg.setHeaderColor?.(bg);
        tg.setBackgroundColor?.(bg);
      } catch (_) {}
    }

    function setTheme(theme, save = true) {
      document.documentElement.dataset.theme = theme;
      if (save) storeSet('domkniga-savings-theme', theme);

      const themeBtn = $('#themeBtn');
      themeBtn.textContent = theme === 'dark' ? '☀️' : '◐';
      themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему');

      syncTelegramChrome();
    }

    $('#themeBtn').addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      setTheme(next, true);
      haptic('light');
    });

    /* ====== HIDE SUMS ====== */

    const hideBtn = $('#hideBtn');

    function syncHideButton() {
      hideBtn.textContent = state.hidden ? '👁' : '🙈';
      hideBtn.setAttribute('aria-pressed', state.hidden ? 'true' : 'false');
      hideBtn.setAttribute('aria-label', state.hidden ? 'Показать суммы' : 'Скрыть суммы');
      hideBtn.title = state.hidden ? 'Показать суммы' : 'Скрыть суммы';
    }

    hideBtn.addEventListener('click', () => {
      state.hidden = !state.hidden;
      storeSet('domkniga-savings-hidden', state.hidden ? '1' : '0');

      syncHideButton();
      renderAll();
      haptic('light');
    });

    /* ====== MODAL HELPERS ====== */

    const backdrop = $('#backdrop');
    const modal = $('#modal');
    let lastFocused = null;

    function enableModalFocusTrap() {
      modal.onkeydown = e => {
        if (e.key !== 'Tab') return;

        const items = $$(
          'button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
          modal
        );

        if (!items.length) return;

        const first = items[0];
        const last = items[items.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      };
    }

    function clearModalInvalid() {
      $$('.invalid', modal).forEach(el => {
        el.classList.remove('invalid');
        el.removeAttribute('aria-invalid');
      });
    }

    function markInvalid(el) {
      el.classList.add('invalid');
      el.setAttribute('aria-invalid', 'true');
      el.focus();
    }

    function closeModal() {
      backdrop.hidden = true;
      modal.innerHTML = '';
      modal.onkeydown = null;
      document.body.style.overflow = '';

      if (lastFocused && document.contains(lastFocused)) {
        lastFocused.focus();
      } else {
        $('#addGoalBtn')?.focus();
      }

      lastFocused = null;
    }

    backdrop.addEventListener('pointerdown', e => {
      if (e.target === backdrop) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !backdrop.hidden) {
        e.preventDefault();
        closeModal();
      }
    });

    /* ====== ADD GOAL MODAL ====== */

    function accountOptionsHTML(selectedId) {
      const cash = ACCOUNTS.filter(a => a.type === 'cash');
      const cards = ACCOUNTS.filter(a => a.type !== 'cash');

      const option = a => `
        <option value="${esc(a.id)}"${a.id === selectedId ? ' selected' : ''}>${esc(a.name)}</option>
      `;

      return `
        ${cash.length ? `<optgroup label="Наличные">${cash.map(option).join('')}</optgroup>` : ''}
        ${cards.length ? `<optgroup label="Карты и счета">${cards.map(option).join('')}</optgroup>` : ''}
      `;
    }

    function openAddGoal() {
      lastFocused = document.activeElement;

      const defaultAccount = ACCOUNTS[0]?.id || '';

      modal.innerHTML = `
        <div class="m-head">
          <h3 id="mTitle">Новая цель <span class="badge plan">сбережения</span></h3>
          <button type="button" class="m-close" id="mClose" title="Закрыть (Esc)" aria-label="Закрыть">✕</button>
        </div>

        <div class="m-body">
          <div class="form-grid">
            <div class="field">
              <label for="agName">Название цели</label>
              <input
                id="agName"
                type="text"
                maxlength="80"
                placeholder="Например: машина, отпуск, ремонт"
                autocomplete="off"
              />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="agSaved">Накоплено, ₽</label>
                <input
                  id="agSaved"
                  type="number"
                  min="0"
                  step="100"
                  inputmode="numeric"
                  value="0"
                />
              </div>

              <div class="field">
                <label for="agTarget">Цель, ₽</label>
                <input
                  id="agTarget"
                  type="number"
                  min="1"
                  step="100"
                  inputmode="numeric"
                  placeholder="Например, 300000"
                />
              </div>
            </div>

            <div class="field">
              <label for="agAccount">Счет</label>
              <select id="agAccount">
                ${accountOptionsHTML(defaultAccount)}
              </select>
            </div>
          </div>
        </div>

        <div class="form-foot">
          <button type="button" class="mini-btn" id="agCancel">
            <span class="btn-t">Отмена</span>
          </button>

          <button type="button" class="mini-btn primary" id="agSave">
            <i class="ic" data-ic="lucide:plus" data-glyph="+"></i>
            <span class="btn-t">Добавить</span>
          </button>
        </div>
      `;

      backdrop.hidden = false;
      document.body.style.overflow = 'hidden';

      hydrateIcons(modal);
      enableModalFocusTrap();
      clearModalInvalid();

      $('#mClose').onclick = closeModal;
      $('#agCancel').onclick = closeModal;
      $('#agSave').onclick = saveNewGoal;

      $('#agName').focus();
    }

    function saveNewGoal() {
      clearModalInvalid();

      const nameEl = $('#agName');
      const savedEl = $('#agSaved');
      const targetEl = $('#agTarget');
      const accountEl = $('#agAccount');

      if (!nameEl || !savedEl || !targetEl || !accountEl) return;

      const name = nameEl.value.trim();
      if (!name) {
        markInvalid(nameEl);
        toast('Укажите название цели');
        haptic('error');
        return;
      }

      const target = Math.round(Number(targetEl.value) || 0);
      if (!Number.isFinite(target) || target <= 0) {
        markInvalid(targetEl);
        toast('Укажите сумму цели');
        haptic('error');
        return;
      }

      const saved = Math.max(0, Math.round(Number(savedEl.value) || 0));
      const accountId = accountEl.value;

      if (!accountById[accountId]) {
        markInvalid(accountEl);
        toast('Выберите счет');
        haptic('error');
        return;
      }

      const id = 'g' + Date.now().toString(36);

      const goal = {
        id,
        name,
        icon: 'lucide:sparkles',
        emoji: '✨',
        color: GOAL_COLORS[goalColorIdx++ % GOAL_COLORS.length],
        target,
        saved,
        accountId
      };

      GOALS.push(goal);
      goalById[id] = goal;

      state.selectedGoal = id;
      state.mode = 'goals';
      state.selectedSegment = id;

      closeModal();
      renderAll();
      haptic('success');
      toast('Цель добавлена');
    }

    $('#addGoalBtn').addEventListener('click', () => {
      openAddGoal();
      haptic('light');
    });

    /* ====== INIT ====== */

    const storedTheme = storeGet('domkniga-savings-theme');
    const hadStoredTheme = storedTheme === 'dark' || storedTheme === 'light';

    if (hadStoredTheme) {
      setTheme(storedTheme, false);
    } else if (tg?.colorScheme) {
      setTheme(tg.colorScheme === 'dark' ? 'dark' : 'light', false);
    } else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      setTheme('dark', false);
    }

    (function initTelegram() {
      if (!tg) return;

      try {
        tg.ready();
        tg.expand();
      } catch (_) {}
    })();

    syncHideButton();
    renderAll();
    syncTelegramChrome();
  </script>
</body>
</html>
