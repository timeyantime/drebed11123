    });

    $('#typeSeg').addEventListener('click', e => {
      const btn = e.target.closest('[data-type]');
      if (!btn) return;

      state.type = btn.dataset.type;
      state.page = 1;
      state.selected.clear();
      renderAll();
      haptic('light');
    });

    $('#periodSeg').addEventListener('click', e => {
      const btn = e.target.closest('[data-period]');
      if (!btn) return;

      state.period = btn.dataset.period;
      state.page = 1;
      state.selected.clear();
      renderAll();
      haptic('light');
    });

    $('#accountSelect').addEventListener('change', e => {
      state.accountId = e.target.value;
      state.page = 1;
      state.selected.clear();
      renderAll();
      haptic('light');
    });

    $('#categorySelect').addEventListener('change', e => {
      state.categoryId = e.target.value;
      state.page = 1;
      state.selected.clear();
      renderAll();
      haptic('light');
    });

    $('#tagSelect').addEventListener('change', e => {
      state.tagId = e.target.value;
      state.page = 1;
      state.selected.clear();
      renderAll();
      haptic('light');
    });

    $('#chips').addEventListener('click', e => {
      const btn = e.target.closest('[data-clear]');
      if (!btn) return;

      const clear = btn.dataset.clear;

      if (clear === 'account') {
        state.accountId = '';
        $('#accountSelect').value = '';
      }

      if (clear === 'category') {
        state.categoryId = '';
        $('#categorySelect').value = '';
      }

      if (clear === 'tag') {
        state.tagId = '';
        $('#tagSelect').value = '';
      }

      if (clear === 'type') state.type = 'all';

      if (clear === 'query') {
        state.query = '';
        $('#searchInput').value = '';
      }

      state.page = 1;
      state.selected.clear();
      renderAll();
      haptic('light');
    });

    $$('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;

        if (state.sortKey === key) {
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortKey = key;
          state.sortDir = key === 'date' || key === 'amount' ? 'desc' : 'asc';
        }

        state.page = 1;
        renderTable();
        haptic('light');
      });
    });

    $('#txBody').addEventListener('change', e => {
      const cb = e.target.closest('[data-select]');
      if (!cb) return;

      toggleSelect(cb.dataset.select, cb.checked);
      haptic('light');
    });

    $('#selectAllPage').addEventListener('change', e => {
      toggleSelectPage(e.target.checked);
      haptic('light');
    });

    $('#txBody').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const id = btn.dataset.tx;
      const action = btn.dataset.action;

      if (action === 'edit') {
        openTxModal(id);
        haptic('light');
        return;
      }

      if (action === 'duplicate') {
        duplicateTransaction(id);
        return;
      }

      if (action === 'delete') {
        if (window.confirm('Удалить операцию?')) deleteTransaction(id);
      }
    });

    $('#prevPageBtn').addEventListener('click', () => {
      state.page = Math.max(1, state.page - 1);
      renderTable();
      haptic('light');
    });

    $('#nextPageBtn').addEventListener('click', () => {
      const filtered = getFilteredTransactions();
      state.page = Math.min(getTotalPages(filtered), state.page + 1);
      renderTable();
      haptic('light');
    });

    $('#pageSizeSelect').addEventListener('change', e => {
      state.pageSize = e.target.value === 'all' ? 'all' : Number(e.target.value);
      state.page = 1;
      renderTable();
      haptic('light');
    });

    $('#bulkExportBtn').addEventListener('click', exportSelected);
    $('#bulkDeleteBtn').addEventListener('click', deleteSelected);
    $('#bulkClearBtn').addEventListener('click', () => {
      clearSelection();
      haptic('light');
    });

    document.addEventListener('keydown', e => {
      if (!backdrop.hidden) return;

      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (state.page > 1) {
          state.page -= 1;
          renderTable();
          haptic('light');
        }
      }

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        const filtered = getFilteredTransactions();
        if (state.page < getTotalPages(filtered)) {
          state.page += 1;
          renderTable();
          haptic('light');
        }
      }
    });

    let resizeTimer = 0;

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.innerWidth > 760) {
          forceCloseTableFullscreen();
        }
      }, 120);
    });

    /* ====== INIT ====== */

    const storedTheme = storeGet('domkniga-tx-table-theme');

    if (storedTheme === 'dark' || storedTheme === 'light') {
      setTheme(storedTheme, false);
    } else if (tg?.colorScheme) {
      setTheme(tg.colorScheme === 'dark' ? 'dark' : 'light', false);
    } else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      setTheme('dark', false);
    }

    (function initTelegram() {
      if (!tg) return;

      try {
        tg.ready();
        tg.expand();
      } catch (_) {}
    })();

    syncHideButton();
    renderAll();
    syncTelegramChrome();
    syncTelegramBackButton();
  </script>
</body>
</html>
