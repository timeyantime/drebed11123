        const text =
          `Чек: ${c.customer}\n` +
          `Дата: ${dateStr}\n` +
          `Юр. статус: ${legalText}\n` +
          `Ставка: ${rateText}\n` +
          `Сумма: ${amountText}\n` +
          `Налог: ${taxText}\n` +
          `К получению: ${netText}`;

        if (navigator.share) {
          try {
            await navigator.share({ title: 'Чек', text });
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        try {
          await navigator.clipboard.writeText(text);
          toast('Данные чека скопированы');
        } catch (_) {
          toast('Не удалось поделиться');
        }
      };

      $('#mDelete').onclick = () => {
        deleteCheck(c.id);
        closeReceipt();
        render();
        haptic('success');
        toast('Чек удалён');
      };

      $('#mClose').focus();
    }

    function closeReceipt() {
      backdrop.hidden = true;
      modal.innerHTML = '';
      modal.onkeydown = null;
      document.body.style.overflow = '';

      syncTelegramBackButton();

      if (lastFocused && document.contains(lastFocused)) {
        lastFocused.focus();
      } else {
        periodBtn?.focus();
      }

      lastFocused = null;
    }

    backdrop.addEventListener('pointerdown', e => {
      if (e.target === backdrop) closeReceipt();
    });

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;

      if (!backdrop.hidden) {
        e.preventDefault();
        closeReceipt();
        return;
      }

      if (pickerState.open) {
        e.preventDefault();
        closePop(true);
      }
    });

    document.addEventListener('click', e => {
      const row = e.target.closest('.chk[data-id]');
      if (!row) return;

      openReceipt(row.dataset.id);
      haptic('light');
    });

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;

      const row = e.target.closest('.chk[data-id]');
      if (!row) return;

      e.preventDefault();
      openReceipt(row.dataset.id);
      haptic('light');
    });

    /* ====== MANUAL RECEIPT MODAL ====== */

    function openManualReceipt() {
      lastFocused = document.activeElement;

      modal.innerHTML = `
        <div class="m-head">
          <h3 id="mTitle">Новый чек <span class="badge normal">вручную</span></h3>
          <button type="button" class="m-close" id="mClose" title="Закрыть (Esc)" aria-label="Закрыть">✕</button>
        </div>

        <div class="m-body">
          <div class="form-grid">
            <div class="field">
              <label for="mCustomer">Покупатель</label>
              <input
                id="mCustomer"
                type="text"
                maxlength="120"
                placeholder="ИП, ООО или ФИО"
                autocomplete="off"
              />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="mLegal">Юр. статус</label>
                <select id="mLegal">
                  <option value="legal">Юр. лицо</option>
                  <option value="phys">Физ. лицо</option>
                </select>
              </div>

              <div class="field">
                <label for="mDate">Дата</label>
                <input
                  id="mDate"
                  type="date"
                  value="${todayISO}"
                  min="${MONTHS[0]}-01"
                  max="${todayISO}"
                />
              </div>
            </div>

            <div class="field">
              <label for="mAmount">Сумма чека, ₽</label>
              <input
                id="mAmount"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
                placeholder="Например, 15000"
              />
            </div>
          </div>

          <div class="readonly-grid">
            <div class="readonly-item">
              <div class="readonly-label">Ставка</div>
              <div class="readonly-value" id="mRateOut">6%</div>
            </div>
            <div class="readonly-item">
              <div class="readonly-label">Налог</div>
              <div class="readonly-value" id="mTaxOut">0 ₽</div>
            </div>
            <div class="readonly-item">
              <div class="readonly-label">К получению</div>
              <div class="readonly-value" id="mNetOut">0 ₽</div>
            </div>
          </div>
        </div>

        <div class="form-foot">
          <button type="button" class="mini-btn" id="mCancel">
            <span class="btn-t">Отмена</span>
          </button>

          <button type="button" class="mini-btn primary" id="mSave">
            <i class="ic" data-ic="lucide:plus" data-glyph="+"></i>
            <span class="btn-t">Добавить</span>
          </button>
        </div>
      `;

      backdrop.hidden = false;
      document.body.style.overflow = 'hidden';

      hydrateIcons(modal);
      syncTelegramBackButton();
      enableModalFocusTrap();
      clearModalInvalid();

      const customerEl = $('#mCustomer');
      const legalEl = $('#mLegal');
      const dateEl = $('#mDate');
      const amountEl = $('#mAmount');
      const rateOut = $('#mRateOut');
      const taxOut = $('#mTaxOut');
      const netOut = $('#mNetOut');

      function recalc() {
        const isLegal = legalEl.value === 'legal';
        const rate = isLegal ? 6 : 4;
        const amount = Math.max(0, Math.round(Number(amountEl.value) || 0));
        const tax = amount > 0 ? Math.round(amount * rate / 100) : 0;
        const net = Math.max(0, amount - tax);

        rateOut.textContent = `${rate}%`;
        taxOut.textContent = `${fmt(tax)} ₽`;
        netOut.textContent = `${fmt(net)} ₽`;
      }

      legalEl.addEventListener('change', recalc);
      amountEl.addEventListener('input', recalc);
      recalc();

      $('#mClose').onclick = closeReceipt;
      $('#mCancel').onclick = closeReceipt;
      $('#mSave').onclick = saveManualReceipt;

      customerEl.focus();
    }

    function saveManualReceipt() {
      clearModalInvalid();

      const customerEl = $('#mCustomer');
      const legalEl = $('#mLegal');
      const dateEl = $('#mDate');
      const amountEl = $('#mAmount');

      if (!customerEl || !legalEl || !dateEl || !amountEl) return;

      const customer = customerEl.value.trim();
      if (!customer) {
        markInvalid(customerEl);
        toast('Укажите покупателя');
        haptic('error');
        return;
      }

      const dateVal = dateEl.value;
      if (!dateVal) {
        markInvalid(dateEl);
        toast('Укажите дату чека');
        haptic('error');
        return;
      }

      const key = dateVal.slice(0, 7);
      if (key > currentKey) {
        markInvalid(dateEl);
        toast('Нельзя добавить чек в будущий период');
        haptic('error');
        return;
      }

      const idx = MONTHS.indexOf(key);
      if (idx < 0) {
        markInvalid(dateEl);
        toast('Дата вне доступного периода');
        haptic('error');
        return;
      }

      const rawAmount = Number(amountEl.value);
      if (!Number.isFinite(rawAmount) || rawAmount <= 0) {
        markInvalid(amountEl);
        toast('Укажите сумму чека');
        haptic('error');
        return;
      }

      const legal = legalEl.value === 'legal';
      const rate = legal ? 6 : 4;
      const amount = Math.max(1, Math.round(rawAmount));
      const tax = Math.max(0, Math.round(amount * rate / 100));

      if (!TAX[key]) {
        TAX[key] = { income: 0, accrued: 0, paid: 0, future: false };
      }

      const t = TAX[key];
      const id = 'ck' + (cid++);

      CHECKS.push({
        id,
        key,
        customer,
        legal,
        rate,
        amount,
        tax,
        date: dateVal,
        status: 'ok'
      });

      t.income += amount;
      t.accrued += tax;

      if (state.period !== 'all' && !keyInCurrentPeriod(key)) {
        state.period = 'month';
        selIdxRef = idx;
      }

      const [a, b] = periodKeys(state.period);
      const set = new Set(MONTHS.slice(a, b + 1));
      const list = CHECKS
        .filter(c => set.has(c.key))
        .sort((x, y) => y.date.localeCompare(x.date));

      const pos = list.findIndex(c => c.id === id);
      state.expanded = pos >= SHOW;
      state.justAdded = id;

      closeReceipt();
      render();
      haptic('success');
      toast('Чек добавлен вручную');
    }

    $('#manualBtn').addEventListener('click', () => {
      openManualReceipt();
      haptic('light');
    });

    /* ====== INIT ====== */

    syncHideButton();
    render();
    syncTelegramChrome();
    syncTelegramBackButton();
  </script>
</body>
</html>
