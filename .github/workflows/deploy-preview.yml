name: Deploy preview to GitHub Pages

# Публикует статический прототип Mono на GitHub Pages.
# После push в main: Actions → Deploy preview → ссылка в описании job "Deploy"
# и во вкладке Environments → github.io. Дизайн доступен по
# https://<владелец>.github.io/<репозиторий>/ (hash-роутинг работает без сервера).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  setup-pages:
    name: Включить GitHub Pages (enablement)
    runs-on: ubuntu-24.04
    steps:
      - name: Enable Pages via REST API (идемпотентно — если уже включено, пропускаем)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          API="https://api.github.com/repos/${OWNER}/${REPO}/pages"
          CODE=$(curl -s -o /tmp/pages-get.json -w "%{http_code}" -H "Authorization: Bearer ${GH_TOKEN}" "${API}")
          if [ "$CODE" = "200" ]; then
            echo "Pages уже включён — ничего не делаем."
            exit 0
          fi
          echo "Pages не найден (HTTP $CODE) — создаём с source=github-actions"
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}" \
            -d '{"build_type":"workflow"}'

  smoke:
    name: Smoke test (Playwright)
    needs: setup-pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium
      - name: Serve site on :8090
        run: |
          python3 -m http.server 8090 > server.log 2>&1 &
          echo $! > server.pid
          sleep 1
          curl -sf http://localhost:8090/index.html > /dev/null
      - name: Run smoke
        run: python docs/smoke.py
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true

  build:
    name: Build static site
    needs: [setup-pages, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare _site (только приложение, без референсов/docs)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp Иконка.png _site/icon.png
          cp -r src _site/src
          # favicon с кириллическим именем меняем на латиницу (надёжнее для URL на Pages)
          sed -i 's/Иконка.png/icon.png/' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
