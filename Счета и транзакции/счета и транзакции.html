<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Домкнига — Счета и транзакции</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f6fa;
      --card: #fff;
      --text: #172033;
      --muted: #7b8496;
      --line: #e7eaf2;

      --accent: #5f6c85;
      --accent-soft: rgba(95, 108, 133, .10);

      --green: #00b894;
      --red: #ff6b6b;
      --amber: #e6a700;
      --slate: #94a3b8;

      --shadow: 0 10px 28px rgba(0, 0, 0, .04);
      --radius: 18px;

      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0f1220;
      --card: #191e30;
      --text: #eef0ff;
      --muted: #8b93ad;
      --line: #262d45;

      --accent: #8b9bb4;
      --accent-soft: rgba(139, 155, 180, .12);

      --green: #2ee6c0;
      --red: #ff8080;
      --amber: #ffd93d;
      --slate: #7f8ea8;

      --shadow: 0 10px 28px rgba(0, 0, 0, .20);

      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: start center;
      min-height: 100dvh;
      padding:
        max(16px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      transition: background .2s, color .2s;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button:focus:not(:focus-visible),
    input:focus:not(:focus-visible),
    select:focus:not(:focus-visible),
    textarea:focus:not(:focus-visible) {
      outline: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stage {
      width: 100%;
      max-width: 980px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand b {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .brand span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .15s, transform .1s;
    }

    .icon-btn:active {
      transform: scale(.96);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      container-type: inline-size;
      container-name: card;

      --fs-2xs: 9px;
      --fs-xs: 10px;
      --fs-sm: 11px;
      --fs-md: 13px;
      --fs-lg: 16px;
    }

    @supports (width: 1cqi) {
      .card {
        --fs-2xs: clamp(8px, 1.35cqi, 10px);
        --fs-xs: clamp(9px, 1.55cqi, 11px);
        --fs-sm: clamp(10px, 1.75cqi, 13px);
        --fs-md: clamp(12px, 2.05cqi, 16px);
        --fs-lg: clamp(14px, 2.35cqi, 19px);
      }
    }

    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .head-text {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: var(--fs-lg);
      font-weight: 800;
      letter-spacing: -.3px;
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: var(--fs-2xs);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      min-width: 0;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: var(--fs-2xs);
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 9px;
      white-space: nowrap;
      transition: background .15s, border-color .15s, transform .1s, filter .15s;
    }

    .btn:hover {
      background: var(--card);
      border-color: var(--muted);
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    .btn.primary:hover {
      filter: brightness(1.06);
    }

    .btn.ghost {
      background: transparent;
    }

    .btn.danger {
      color: var(--red);
      border-color: rgba(255, 107, 107, .20);
      background: rgba(255, 107, 107, .06);
    }

    .btn.small {
      height: 26px;
      padding: 0 9px;
      font-size: 9px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }

    .kpi {
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 9px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-top {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .kpi-ic {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--icon-color, var(--muted));
      flex: 0 0 auto;
      font-size: 13px;
    }

    .kpi-label {
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .kpi-value {
      font-size: var(--fs-sm);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-sub {
      color: var(--muted);
      font-size: var(--fs-2xs);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi.positive .kpi-value {
      color: var(--green);
    }

    .kpi.negative .kpi-value {
      color: var(--red);
    }

    .section {
      margin-top: 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      min-width: 0;
    }

    .section-title {
      margin: 0;
      font-size: var(--fs-sm);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-wrap {
      position: relative;
    }

    .accounts-carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 2px 12px;
      scrollbar-width: none;
      touch-action: pan-x;
    }

    .accounts-carousel::-webkit-scrollbar {
      display: none;
    }

    .carousel-arrow {
      position: absolute;
      top: calc(50% - 22px);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      display: none;
      place-items: center;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .08);
      font-size: 18px;
      font-weight: 800;
      transition: background .15s, transform .1s, opacity .15s;
    }

    .carousel-arrow:hover {
      background: var(--bg);
    }

    .carousel-arrow:active {
      transform: scale(.96);
    }

    .carousel-arrow:disabled {
      opacity: .28;
      cursor: not-allowed;
    }

    .carousel-arrow.left {
      left: 0;
    }

    .carousel-arrow.right {
      right: 0;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      min-height: 14px;
    }

    .carousel-dots button {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      border: 0;
      background: var(--line);
      cursor: pointer;
      padding: 0;
      transition: width .18s ease, background .18s ease;
    }

    .carousel-dots button.on {
      width: 20px;
      background: var(--accent);
    }

    .bank-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 24px;
      background: var(--card-bg);
      color: var(--card-fg);
      box-shadow:
        0 22px 45px -28px rgba(0, 0, 0, .62),
        inset 0 1px 0 rgba(255, 255, 255, .18);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      aspect-ratio: 1.586 / 1;
      min-height: 194px;
      scroll-snap-align: center;
      cursor: pointer;
      user-select: none;
      text-align: left;
      container-type: inline-size;
      container-name: bankcard;
      transition:
        transform .22s cubic-bezier(.2, .8, .2, 1),
        box-shadow .22s ease,
        border-color .18s ease,
        filter .18s ease;
    }

    .accounts-carousel:not(.animated) .bank-card {
      animation: none !important;
    }

    .accounts-carousel.animated .bank-card {
      animation: cardIn .52s cubic-bezier(.16, 1, .3, 1) backwards;
      animation-delay: calc(var(--i) * 55ms);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.97);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .bank-card::before {
      content: "";
      position: absolute;
      inset: -45% -20% auto auto;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .24), transparent 66%);
      pointer-events: none;
      z-index: 0;
    }

    .bank-card::after {
      content: "";
      position: absolute;
      inset: auto -10% -35% auto;
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 0, 0, .10), transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    .bank-card > * {
      position: relative;
      z-index: 1;
    }

    .bank-card:hover {
      transform: translateY(-4px) scale(1.012);
      box-shadow:
        0 30px 55px -30px rgba(0, 0, 0, .68),
        inset 0 1px 0 rgba(255, 255, 255, .22);
    }

    .bank-card:active {
      transform: translateY(-1px) scale(.995);
    }

    .bank-card.filtered {
      border-color: var(--accent);
      box-shadow:
        0 0 0 2px var(--accent-soft),
        0 30px 55px -30px rgba(0, 0, 0, .68),
        inset 0 1px 0 rgba(255, 255, 255, .22);
    }

    .bc-shine {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        115deg,
        transparent 28%,
        rgba(255, 255, 255, .20) 42%,
        transparent 56%
      );
      transform: translateX(-130%);
      transition: transform .85s ease;
    }

    .bank-card:hover .bc-shine {
      transform: translateX(130%);
    }

    .bc-top {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      min-width: 0;
    }

    .bc-logo {
      width: clamp(34px, 16cqi, 46px);
      aspect-ratio: 1;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }

    .bc-logo svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .12));
    }

    .bc-titles {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bc-bank {
      font-size: clamp(10px, 4.4cqi, 13px);
      font-weight: 800;
      opacity: .78;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bc-name {
      font-size: clamp(13px, 5.8cqi, 18px);
      font-weight: 800;
      letter-spacing: -.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bc-type {
      height: 22px;
      border-radius: 999px;
      border: 1px solid currentColor;
      opacity: .72;
      font-size: clamp(8px, 3.2cqi, 10px);
      font-weight: 800;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .bc-middle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .bc-chip {
      width: clamp(38px, 18cqi, 50px);
      aspect-ratio: 1.38 / 1;
      border-radius: 7px;
      background:
        linear-gradient(135deg, #f7dc6f 0%, #d4ac0d 42%, #f9e79f 58%, #b7950b 100%);
      box-shadow:
        inset 0 0 0 1px rgba(0, 0, 0, .12),
        0 6px 14px rgba(0, 0, 0, .12);
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .bc-chip::before,
    .bc-chip::after {
      content: "";
      position: absolute;
      background: rgba(0, 0, 0, .16);
    }

    .bc-chip::before {
      left: 0;
      right: 0;
      top: 42%;
      height: 1px;
    }

    .bc-chip::after {
      top: 0;
      bottom: 0;
      left: 42%;
      width: 1px;
    }

    .bc-contactless {
      width: clamp(22px, 10cqi, 30px);
      aspect-ratio: 1;
      opacity: .78;
      flex: 0 0 auto;
    }

    .bc-contactless svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bc-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .bc-number {
      font-size: clamp(11px, 4.8cqi, 15px);
      font-weight: 800;
      letter-spacing: .12em;
      white-space: nowrap;
      opacity: .92;
      font-variant-numeric: tabular-nums;
    }

    .bc-balance {
      text-align: right;
      min-width: 0;
    }

    .bc-balance span {
      display: block;
      font-size: clamp(8px, 3.2cqi, 10px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .2px;
      opacity: .68;
      white-space: nowrap;
    }

    .bc-balance strong {
      display: block;
      margin-top: 2px;
      font-size: clamp(20px, 9.2cqi, 34px);
      font-weight: 800;
      letter-spacing: -.7px;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .preview-card {
      width: min(330px, 100%);
      margin: 0 auto 12px;
      cursor: default;
    }

    .preview-card:hover {
      transform: none;
    }

    .toolbar {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .search-wrap {
      position: relative;
      min-width: 0;
    }

    .search-wrap .ic {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: var(--fs-xs);
      font-weight: 700;
      padding: 0 30px;
      outline: none;
      transition: border-color .15s, background .15s;
      min-width: 0;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--card);
    }

    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .search-clear:hover {
      background: var(--line);
      color: var(--text);
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .seg::-webkit-scrollbar {
      display: none;
    }

    .seg button {
      flex: 0 0 auto;
      height: 26px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      padding: 0 9px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s, box-shadow .15s;
    }

    .seg button:hover {
      color: var(--text);
    }

    .seg button.on {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
    }

    .select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .select-wrap select {
      appearance: none;
      -webkit-appearance: none;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 9px;
      font-weight: 800;
      padding: 0 24px 0 9px;
      cursor: pointer;
      outline: none;
      transition: border-color .15s, background .15s;
      min-width: 120px;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-wrap select:hover {
      background: var(--card);
      border-color: var(--muted);
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 9px;
      top: 50%;
      width: 5px;
      height: 5px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .chips {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .chip {
      height: 24px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .chip button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      line-height: 1;
      padding: 0;
      display: grid;
      place-items: center;
      opacity: .75;
    }

    .chip button:hover {
      opacity: 1;
      color: var(--text);
    }

    .tx-list {
      display: grid;
      gap: 8px;
    }

    .tx-group {
      min-width: 0;
    }

    .group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 4px 6px;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .group-date {
      font-size: var(--fs-xs);
      font-weight: 800;
      white-space: nowrap;
    }

    .group-total {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .group-total .inc {
      color: var(--green);
    }

    .group-total .exp {
      color: var(--red);
    }

    .tx-rows {
      display: grid;
      gap: 2px;
      padding-top: 4px;
    }

    .tx-row {
      width: 100%;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 7px 8px;
      text-align: left;
      cursor: pointer;
      min-width: 0;
      transition: background .15s, border-color .15s, transform .1s;
    }

    .tx-row:hover {
      background: var(--bg);
    }

    .tx-row:active {
      transform: scale(.995);
    }

    .tx-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--bg);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--tx-color, var(--muted));
      flex: 0 0 auto;
      overflow: hidden;
    }

    @supports (background: color-mix(in srgb, red 10%, blue)) {
      .tx-icon {
        background: color-mix(in srgb, var(--tx-color, var(--muted)) 10%, var(--card));
        border-color: color-mix(in srgb, var(--tx-color, var(--muted)) 16%, var(--line));
      }
    }

    .tx-main {
      min-width: 0;
    }

    .tx-title {
      font-size: var(--fs-sm);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-meta {
      margin-top: 1px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-amount {
      font-size: var(--fs-sm);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-align: right;
    }

    .tx-amount.income {
      color: var(--green);
    }

    .tx-amount.expense {
      color: var(--red);
    }

    .tx-amount.transfer {
      color: var(--accent);
    }

    .empty-state {
      padding: 22px 10px;
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-align: center;
    }

    .ic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 15px;
      line-height: 1;
      color: currentColor;
      vertical-align: middle;
      flex: 0 0 auto;
      overflow: visible;
    }

    .ic.loaded {
      background-color: currentColor;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 18, 32, .40);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(14px + env(safe-area-inset-top))
        calc(12px + env(safe-area-inset-right))
        calc(14px + env(safe-area-inset-bottom))
        calc(12px + env(safe-area-inset-left));
      animation: fade .18s;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      width: 100%;
      max-width: 430px;
      max-height: calc(100dvh - 28px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .15);
      animation: rise .22s cubic-bezier(.16, 1, .3, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.98);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .m-head {
      padding: 13px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--bg) 0%, var(--card) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: 0 0 auto;
    }

    .m-head h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.2px;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .m-close {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 16px;
      transition: background .15s;
      flex: 0 0 auto;
    }

    .m-close:hover {
      background: var(--bg);
      color: var(--text);
    }

    .m-body {
      padding: 13px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .form-grid {
      display: grid;
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .field label {
      font-size: 8px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .25px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 0 9px;
      outline: none;
      transition: border-color .15s, background .15s;
      min-width: 0;
    }

    .field input,
    .field select {
      height: 34px;
    }

    .field textarea {
      min-height: 64px;
      resize: vertical;
      padding: 9px;
      line-height: 1.35;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      background: var(--card);
    }

    .field input.invalid,
    .field select.invalid,
    .field textarea.invalid {
      border-color: var(--red);
      background: rgba(255, 107, 107, .08);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-width: 0;
    }

    .type-seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }

    .type-seg button {
      flex: 1;
      height: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      border-radius: 7px;
      cursor: pointer;
      transition: background .15s, color .15s, box-shadow .15s;
    }

    .type-seg button.on {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
    }

    .form-foot {
      display: flex;
      gap: 7px;
      padding: 11px 13px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      flex: 0 0 auto;
      flex-wrap: wrap;
    }

    .form-foot .btn {
      flex: 1 1 120px;
      height: 34px;
      border-radius: 9px;
      font-size: var(--fs-xs);
    }

    .details-hero {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
    }

    .details-ic {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: var(--tx-color, var(--muted));
      background: var(--bg);
      border: 1px solid var(--line);
      flex: 0 0 auto;
      overflow: hidden;
    }

    @supports (background: color-mix(in srgb, red 10%, blue)) {
      .details-ic {
        background: color-mix(in srgb, var(--tx-color, var(--muted)) 12%, var(--card));
      }
    }

    .details-title {
      min-width: 0;
    }

    .details-name {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .details-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .details-amount {
      margin-left: auto;
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .details-amount.income { color: var(--green); }
    .details-amount.expense { color: var(--red); }
    .details-amount.transfer { color: var(--accent); }

    .details-rows {
      display: grid;
      gap: 6px;
    }

    .d-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      font-size: 11px;
      min-width: 0;
    }

    .d-row span:first-child {
      color: var(--muted);
      font-weight: 800;
    }

    .d-row span:last-child {
      font-weight: 700;
      word-break: break-word;
    }

    .account-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin: 10px 0;
    }

    .acc-stat {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 8px;
      min-width: 0;
    }

    .acc-stat span {
      display: block;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .acc-stat strong {
      display: block;
      margin-top: 3px;
      font-size: var(--fs-sm);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .acc-stat.inc strong { color: var(--green); }
    .acc-stat.exp strong { color: var(--red); }

    .recent-title {
      margin: 12px 0 6px;
      font-size: var(--fs-xs);
      font-weight: 800;
      color: var(--muted);
    }

    .recent-list {
      display: grid;
      gap: 3px;
      max-height: 190px;
      overflow: auto;
      scrollbar-width: thin;
      padding-right: 2px;
    }

    .mini-tx {
      width: 100%;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 7px;
      cursor: pointer;
      text-align: left;
      min-width: 0;
      transition: background .15s, transform .1s;
    }

    .mini-tx:hover {
      background: var(--card);
    }

    .mini-tx:active {
      transform: scale(.99);
    }

    .mini-ic {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--tx-color, var(--muted));
      flex: 0 0 auto;
      overflow: hidden;
    }

    .mini-main {
      min-width: 0;
    }

    .mini-name {
      font-size: var(--fs-xs);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-meta {
      margin-top: 1px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-amount {
      font-size: var(--fs-xs);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      background: var(--text);
      color: var(--card);
      padding: 9px 13px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 150;
      white-space: nowrap;
      max-width: min(90vw, 340px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 760px) {
      .accounts-carousel {
        padding-left: 42px;
        padding-right: 42px;
        scroll-snap-type: x proximity;
      }

      .bank-card {
        flex: 0 0 calc(50% - 6px);
        scroll-snap-align: start;
      }

      .carousel-arrow {
        display: grid;
      }
    }

    @media (max-width: 759px) {
      .bank-card {
        flex: 0 0 100%;
      }
    }

    @media (max-width: 860px) {
      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .head {
        align-items: center;
      }

      .filter-row {
        align-items: flex-start;
      }

      .select-wrap select {
        min-width: 104px;
        max-width: 144px;
      }
    }

    @media (max-width: 430px) {
      .card {
        padding: 12px;
      }

      .kpi-grid {
        gap: 6px;
      }

      .kpi {
        padding: 8px;
      }

      .bank-card {
        border-radius: 22px;
        padding: 14px;
        min-height: 188px;
      }

      .tx-row {
        grid-template-columns: 32px minmax(0, 1fr) auto;
        gap: 8px;
        padding: 7px;
      }

      .tx-icon {
        width: 32px;
        height: 32px;
        border-radius: 10px;
      }

      .field-row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="topline">
      <div class="brand">
        <b>Домкнига</b>
        <span>· счета и транзакции</span>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="hideBtn" type="button" aria-label="Скрыть суммы" aria-pressed="false" title="Скрыть суммы">🙈</button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Переключить тему" title="Тема">◐</button>
      </div>
    </div>

    <section class="card">
      <div class="head">
        <div class="head-text">
          <h1 class="title">Счета и транзакции</h1>
          <div class="subtitle" id="summaryLine">—</div>
        </div>

        <button class="btn primary" id="addBtn" type="button">
          <span>＋</span>
          <span>Операция</span>
        </button>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-top">
            <span class="kpi-ic" style="--icon-color:var(--accent)">
              <i class="ic" data-ic="lucide:wallet" data-glyph="💼"></i>
            </span>
            <span class="kpi-label">Все счета</span>
          </div>
          <div class="kpi-value" id="kpiBalance">—</div>
          <div class="kpi-sub" id="kpiBalanceSub">—</div>
        </div>

        <div class="kpi positive">
          <div class="kpi-top">
            <span class="kpi-ic" style="--icon-color:var(--green)">
              <i class="ic" data-ic="lucide:arrow-down-left" data-glyph="↙"></i>
            </span>
            <span class="kpi-label">Доходы</span>
          </div>
          <div class="kpi-value" id="kpiIncome">—</div>
          <div class="kpi-sub" id="kpiIncomeSub">—</div>
        </div>

        <div class="kpi negative">
          <div class="kpi-top">
            <span class="kpi-ic" style="--icon-color:var(--red)">
              <i class="ic" data-ic="lucide:arrow-up-right" data-glyph="↗"></i>
            </span>
            <span class="kpi-label">Расходы</span>
          </div>
          <div class="kpi-value" id="kpiExpense">—</div>
          <div class="kpi-sub" id="kpiExpenseSub">—</div>
        </div>

        <div class="kpi">
          <div class="kpi-top">
            <span class="kpi-ic" style="--icon-color:var(--accent)">
              <i class="ic" data-ic="lucide:scale" data-glyph="⚖️"></i>
            </span>
            <span class="kpi-label">Итог</span>
          </div>
          <div class="kpi-value" id="kpiNet">—</div>
          <div class="kpi-sub" id="kpiNetSub">—</div>
        </div>
      </div>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Счета</h2>
          <button class="btn primary small" id="addAccountBtn" type="button">
            <span>＋</span>
            <span>Счёт</span>
          </button>
        </div>

        <div class="carousel-wrap">
          <button class="carousel-arrow left" id="accountsPrev" type="button" aria-label="Предыдущий счёт">‹</button>

          <div class="accounts-carousel animated" id="accountsCarousel" role="list" aria-label="Счета"></div>

          <button class="carousel-arrow right" id="accountsNext" type="button" aria-label="Следующий счёт">›</button>
        </div>

        <div class="carousel-dots" id="accountsDots" aria-label="Навигация по счетам"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Транзакции</h2>
          <div class="chips" id="chips"></div>
        </div>

        <div class="toolbar">
          <div class="search-wrap">
            <i class="ic" data-ic="lucide:search" data-glyph="🔎"></i>
            <input class="search-input" id="searchInput" type="search" placeholder="Поиск: магазин, категория, счёт, заметка" autocomplete="off" />
            <button class="search-clear" id="searchClear" type="button" hidden aria-label="Очистить поиск">✕</button>
          </div>

          <div class="filter-row">
            <div class="seg" id="typeSeg" role="group" aria-label="Тип операций">
              <button type="button" data-type="all" class="on">Все</button>
              <button type="button" data-type="income">Доходы</button>
              <button type="button" data-type="expense">Расходы</button>
              <button type="button" data-type="transfer">Переводы</button>
            </div>

            <div class="seg" id="periodSeg" role="group" aria-label="Период">
              <button type="button" data-period="1m" class="on">1М</button>
              <button type="button" data-period="3m">3М</button>
              <button type="button" data-period="6m">6М</button>
              <button type="button" data-period="1y">1Г</button>
              <button type="button" data-period="all">Всё</button>
            </div>

            <label class="select-wrap">
              <span class="sr-only">Категория</span>
              <select id="categorySelect" aria-label="Категория">
                <option value="">Все категории</option>
              </select>
            </label>

        <div class="tx-list" id="txList"></div>
      </section>
    </section>
  </div>

  <div class="backdrop" id="backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="srStatus" class="sr-only" aria-live="polite"></div>

  <script>
    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

    const numberFormatter = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
    const fmt = n => numberFormatter.format(Math.round(Number(n) || 0));
    const DAY_MS = 86400000;

    const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tg = window.Telegram?.WebApp;

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function plural(n, forms) {
      const abs = Math.abs(n);
      const n10 = abs % 10;
      const n100 = abs % 100;

      if (n10 === 1 && n100 !== 11) return forms[0];
      if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
      return forms[2];
    }

    function storeGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (_) {
        return null;
      }
    }

    function storeSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (_) {}
    }

    /* ====== ICONIFY WITH REDUNDANCY ====== */

    const ICON_HOSTS = [
      'https://api.iconify.design',
      'https://api.simplesvg.com',
      'https://api.unisvg.com'
    ];

    const iconCache = new Map();
    const iconPromises = new Map();

    function iconPath(name) {
      const [prefix, ...rest] = name.split(':');
      return `${prefix}/${rest.join(':')}.svg`;
    }

    function probeImage(url, timeout = 750) {
      return new Promise(resolve => {
        const img = new Image();
        let settled = false;

        const finish = ok => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (!ok) img.src = '';
          resolve(ok);
        };

        const timer = setTimeout(() => finish(false), timeout);

        img.onload = () => finish(true);
        img.onerror = () => finish(false);
        img.src = url;
      });
    }

    function resolveIconUrl(name) {
      const cached = iconCache.get(name);
      if (cached) return Promise.resolve(cached.url);

      let promise = iconPromises.get(name);
      if (promise) return promise;

      promise = (async () => {
        const path = iconPath(name);

        for (const host of ICON_HOSTS) {
          const url = `${host}/${path}`;

      if (el.dataset.state === 'fail') {

        tx.toAccountId ? accountName(tx.toAccountId) : '',
        tx.note
      ].join(' ').toLowerCase();
    }

    function getFilteredTransactions() {
      const q = state.query.trim().toLowerCase();

      return state.transactions
        .filter(tx => {
          if (!inPeriod(tx, state.period)) return false;
          if (state.type !== 'all' && tx.type !== state.type) return false;
          if (state.categoryId && tx.categoryId !== state.categoryId) return false;

          if (state.accountId) {
            const involved = tx.accountId === state.accountId || tx.toAccountId === state.accountId;
            if (!involved) return false;
          }

          if (q && !txHaystack(tx).includes(q)) return false;

          return true;
        })
        .sort((a, b) =>
          b.date.localeCompare(a.date) ||
          b.amount - a.amount
        );
    }

    function groupByDate(list) {
      const groups = [];
      let current = null;

      list.forEach(tx => {
        if (!current || current.key !== tx.date) {
          current = {
            key: tx.date,
            items: [],
            income: 0,
            expense: 0
          };
          groups.push(current);
        }

        current.items.push(tx);

        if (tx.type === 'income') current.income += tx.amount;
        if (tx.type === 'expense') current.expense += tx.amount;
      });

      return groups;
    }

    /* ====== BALANCE OPERATIONS ====== */

    function applyTransactionToBalances(tx, direction = 1) {
      const from = accountById(tx.accountId);

      if (tx.type === 'expense' && from) {
        from.balance -= tx.amount * direction;
      }

      if (tx.type === 'income' && from) {
        from.balance += tx.amount * direction;
      }

      if (tx.type === 'transfer') {
        const to = accountById(tx.toAccountId);
        if (from) from.balance -= tx.amount * direction;
        if (to) to.balance += tx.amount * direction;
      }
    }

    /* ====== RENDER KPI ====== */

    function renderKpis() {
      const totalBalance = state.accounts.reduce((sum, a) => sum + a.balance, 0);

      const periodTx = state.transactions.filter(tx => inPeriod(tx, state.period));
      const income = periodTx.filter(tx => tx.type === 'income').reduce((sum, tx) => sum + tx.amount, 0);
      const expense = periodTx.filter(tx => tx.type === 'expense').reduce((sum, tx) => sum + tx.amount, 0);
      const net = income - expense;
      const label = periodLabel(state.period);

      $('#kpiBalance').textContent = money(totalBalance);
      $('#kpiBalanceSub').textContent = `${state.accounts.length} ${plural(state.accounts.length, ['счёт', 'счета', 'счетов'])}`;

      $('#kpiIncome').textContent = money(income);
      $('#kpiIncomeSub').textContent = label;

      $('#kpiExpense').textContent = money(expense);
      $('#kpiExpenseSub').textContent = label;

      $('#kpiNet').textContent = signedPlainMoney(net);
      $('#kpiNet').style.color = net >= 0 ? 'var(--green)' : 'var(--red)';
      $('#kpiNetSub').textContent = label;

      const visible = getFilteredTransactions().length;
      $('#summaryLine').textContent =
        `${visible} ${plural(visible, ['операция', 'операции', 'операций'])} · ${label}`;
    }

    /* ====== CAROUSEL ====== */

    let accountsAnimated = false;
    let justCarouselDragged = false;

    function getCardStep() {
      const el = $('#accountsCarousel');
      const card = el?.querySelector('.bank-card');
      if (!el || !card) return 300;

      const styles = getComputedStyle(el);
      const gap = parseFloat(styles.columnGap || styles.gap || '12') || 12;
      return card.offsetWidth + gap;
    }

    function updateCarouselDots() {
      const el = $('#accountsCarousel');
      const step = getCardStep();
      const page = Math.max(0, Math.min(state.accounts.length - 1, Math.round(el.scrollLeft / step)));

      $('#accountsDots').innerHTML = state.accounts.map((_, i) => `
        <button
          type="button"
          class="${i === page ? 'on' : ''}"
          data-page="${i}"
          aria-label="Счёт ${i + 1}"
        ></button>
      `).join('');
    }

    function updateCarouselArrows() {
      const el = $('#accountsCarousel');
      const prev = $('#accountsPrev');
      const next = $('#accountsNext');

      if (!el || !prev || !next) return;

      const maxScroll = el.scrollWidth - el.clientWidth - 2;
      prev.disabled = el.scrollLeft <= 2;
      next.disabled = el.scrollLeft >= maxScroll;
    }

    function updateCarouselState() {
      updateCarouselDots();
      updateCarouselArrows();
    }

    function scrollAccountsByPages(delta) {
      const el = $('#accountsCarousel');
      el.scrollBy({
        left: delta * getCardStep(),
        behavior: reduced() ? 'auto' : 'smooth'
      });
    }

    function scrollToAccountPage(page) {
      const el = $('#accountsCarousel');
      el.scrollTo({
        left: page * getCardStep(),
        behavior: reduced() ? 'auto' : 'smooth'
      });
    }

    function renderAccounts() {
      const el = $('#accountsCarousel');

      el.classList.toggle('animated', !accountsAnimated);
      el.innerHTML = state.accounts.map((acc, i) => bankCardHTML(acc, i)).join('');

      accountsAnimated = true;

      requestAnimationFrame(updateCarouselState);
    }

    /* ====== RENDER CHIPS ====== */

    function renderChips() {
      const chips = [];

      if (state.accountId) {
        chips.push(`
          <span class="chip">
            Счёт: ${esc(accountName(state.accountId))}

    /* ====== RENDER TRANSACTIONS ====== */

    function transactionRowHTML(tx) {
      const cat = categoryById(tx.categoryId);
      const acc = accountById(tx.accountId);
      const to = tx.toAccountId ? accountById(tx.toAccountId) : null;

      const meta = tx.type === 'transfer'
        ? `${esc(acc?.name || 'Счёт')} → ${esc(to?.name || 'Счёт')}`
        : `${esc(cat.name)} · ${esc(acc?.name || 'Счёт')}`;

      return `
        <button
          type="button"
          class="tx-row"
          data-tx="${esc(tx.id)}"
          aria-label="${esc(`${tx.merchant}, ${signedMoney(tx.amount, tx.type)}`)}"
        >
          <span class="tx-icon" style="--tx-color:${esc(cat.color)}">
            <i class="ic" data-ic="${esc(cat.icon)}" data-glyph="${esc(cat.glyph)}"></i>
          </span>

          <span class="tx-main">
            <span class="tx-title">${esc(tx.merchant || cat.name)}</span>
            <span class="tx-meta">${meta}</span>
          </span>

          <span class="tx-amount ${esc(tx.type)}">
            ${esc(signedMoney(tx.amount, tx.type))}
          </span>
        </button>
      `;
    }

    function renderTransactions() {
      const list = getFilteredTransactions();
      const groups = groupByDate(list);
      const el = $('#txList');

      if (!groups.length) {
        el.innerHTML = `<div class="empty-state">Нет операций по выбранным фильтрам</div>`;
        return;
      }

      el.innerHTML = groups.map(group => {
        const totalParts = [];

        if (group.income > 0) {
          totalParts.push(`<span class="inc">+${esc(compact(group.income))}</span>`);
        }

        if (group.expense > 0) {
          totalParts.push(`<span class="exp">−${esc(compact(group.expense))}</span>`);
        }

        return `
          <section class="tx-group">
            <div class="group-head">
              <div class="group-date">${esc(dayLabel(group.key))}</div>
              <div class="group-total">${totalParts.join(' · ') || '—'}</div>
            </div>

            <div class="tx-rows">
              ${group.items.map(transactionRowHTML).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    /* ====== RENDER CONTROLS ====== */

    function updateSegButtons() {
      $$('#typeSeg button').forEach(btn => {
        btn.classList.toggle('on', btn.dataset.type === state.type);
      });

      $$('#periodSeg button').forEach(btn => {
        btn.classList.toggle('on', btn.dataset.period === state.period);
      });
    }

    function buildCategoryOptions() {
      const select = $('#categorySelect');
      const current = state.categoryId;

      const groups = [
        { label: 'Расходы', kinds: ['expense'] },
        { label: 'Доходы', kinds: ['income'] },
        { label: 'Переводы', kinds: ['transfer'] }
      ];

      let html = `<option value="">Все категории</option>`;

      groups.forEach(g => {
        const items = Object.entries(CATEGORIES)
          .filter(([, c]) => g.kinds.includes(c.kind))
          .sort((a, b) => a[1].name.localeCompare(b[1].name, 'ru'));

        if (!items.length) return;

        html += `<optgroup label="${esc(g.label)}">`;
        items.forEach(([id, c]) => {
          html += `<option value="${esc(id)}"${id === current ? ' selected' : ''}>${esc(c.name)}</option>`;
        });
        html += `</optgroup>`;
      });

      select.innerHTML = html;
    }

    function updateSearchClear() {
      $('#searchClear').hidden = !state.query;
    }

    /* ====== RENDER ALL ====== */

    function renderAll() {
      renderKpis();
      renderAccounts();
      renderChips();
      renderTransactions();
      updateSegButtons();
      updateSearchClear();
      hydrateIcons(document);
    }

    function renderTransactionsOnly() {
      renderKpis();
      renderChips();
      renderTransactions();

      hydrateIcons($('#txList'));

    /* ====== MODAL BASE ====== */

    const backdrop = $('#backdrop');
    const modal = $('#modal');
    let lastFocused = null;

    function syncTelegramBackButton() {
      if (!tg?.BackButton) return;

      if (!backdrop.hidden) {
        tg.BackButton.show();
      } else {
        tg.BackButton.hide();
      }
    }

    if (tg?.BackButton?.onClick) {
      tg.BackButton.onClick(() => {
        if (!backdrop.hidden) closeModal();
      });
    }

    function closeModal() {
      backdrop.hidden = true;
      modal.innerHTML = '';
      document.body.style.overflow = '';

      syncTelegramBackButton();

      if (lastFocused && document.contains(lastFocused)) {
        lastFocused.focus();
      } else {
        $('#addBtn')?.focus();
      }

      lastFocused = null;
    }

    backdrop.addEventListener('pointerdown', e => {
      if (e.target === backdrop) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !backdrop.hidden) {
        e.preventDefault();
        closeModal();
      }
    });

    function markInvalid(el) {
      if (!el) return;
      el.classList.add('invalid');
      el.setAttribute('aria-invalid', 'true');
      el.focus();
    }

    function clearInvalid(root = modal) {
      $$('.invalid', root).forEach(el => {
        el.classList.remove('invalid');
        el.removeAttribute('aria-invalid');
      });
    }

    /* ====== ACCOUNT MODAL ====== */

    function bankOptionsHTML(selected) {
      return Object.entries(BANK_META).map(([id, meta]) => `
        <option value="${esc(id)}"${id === selected ? ' selected' : ''}>${esc(meta.name)}</option>
      `).join('');
    }

    function accountTypeOptionsHTML(selected) {
      return Object.entries(ACCOUNT_TYPES).map(([id, name]) => `
        <option value="${esc(id)}"${id === selected ? ' selected' : ''}>${esc(name)}</option>
      `).join('');
    }

      lastFocused = document.activeElement;

      const isEdit = !!acc;

      modal.innerHTML = `

          <h3 id="modalTitle">${isEdit ? 'Изменить счёт' : 'Новый счёт'}</h3>
          <button type="button" class="m-close" id="mClose" aria-label="Закрыть">✕</button>

            </div>

              <div class="field">
                <label for="amMasked">Маскированный номер</label>
                <input
                  id="amMasked"

                />

              <div class="field">

        </div>
      `;

      backdrop.hidden = false;
      document.body.style.overflow = 'hidden';
      syncTelegramBackButton();
      hydrateIcons(modal);

      $('#mClose').onclick = closeModal;
      $('#amCancel').onclick = closeModal;
      $('#amSave').onclick = () => saveAccount(accountId);

      $('#amName').focus();
    }

    function saveAccount(accountId = null) {
      clearInvalid();

      const nameEl = $('#amName');
      const bankEl = $('#amBank');
      const typeEl = $('#amType');
      const maskedEl = $('#amMasked');
      const balanceEl = $('#amBalance');
      const noteEl = $('#amNote');

      if (!nameEl || !bankEl || !typeEl || !maskedEl || !balanceEl) return;

      const name = nameEl.value.trim();
      if (!name) {
        markInvalid(nameEl);
        toast('Укажите название счёта');
        haptic('error');
        return;
      }

      const balance = Math.round(Number(balanceEl.value) || 0);
      if (!Number.isFinite(balance)) {
        markInvalid(balanceEl);
        toast('Укажите баланс');
        haptic('error');
        return;
      }

      const bankId = bankEl.value in BANK_META ? bankEl.value : 'other';
      const type = typeEl.value in ACCOUNT_TYPES ? typeEl.value : 'other';
      const masked = maskedEl.value.trim() || defaultMask(bankId);
      const note = noteEl?.value.trim() || '';

      if (accountId) {
        const acc = accountById(accountId);
        if (!acc) return;

        acc.name = name;
        acc.bankId = bankId;
        acc.type = type;
        acc.masked = masked;
        acc.balance = balance;
        acc.note = note;

        closeModal();
        renderAll();
        haptic('success');
        toast('Счёт обновлён');
        return;
      }

      const id = 'acc' + Date.now().toString(36);

      state.accounts.push({
        id,
        bankId,
        name,
        type,
        masked,
        balance,
        note
      });

      closeModal();
      renderAll();
      haptic('success');
      toast('Счёт добавлен');
    }

    /* ====== ACCOUNT DETAILS ====== */

    function accountStats(id) {
      const all = state.transactions.filter(tx => tx.accountId === id || tx.toAccountId === id);
      const period = all.filter(tx => inPeriod(tx, state.period));

      const income = period
        .filter(tx =>
          (tx.type === 'income' && tx.accountId === id) ||
          (tx.type === 'transfer' && tx.toAccountId === id)
        )
        .reduce((sum, tx) => sum + tx.amount, 0);

      const expense = period
        .filter(tx =>
          (tx.type === 'expense' && tx.accountId === id) ||
          (tx.type === 'transfer' && tx.accountId === id)
        )
        .reduce((sum, tx) => sum + tx.amount, 0);

      const recent = [...all]
        .sort((a, b) => b.date.localeCompare(a.date) || b.amount - a.amount)
        .slice(0, 4);

      return {
        allCount: all.length,
        periodCount: period.length,
        income,
        expense,
        recent
      };
    }

    function miniTransactionHTML(tx) {
      const cat = categoryById(tx.categoryId);
      const acc = accountById(tx.accountId);
      const to = tx.toAccountId ? accountById(tx.toAccountId) : null;

      const meta = tx.type === 'transfer'
        ? `${esc(acc?.name || 'Счёт')} → ${esc(to?.name || 'Счёт')}`
        : `${esc(cat.name)} · ${esc(dayLabel(tx.date))}`;

      return `
        <button type="button" class="mini-tx" data-tx="${esc(tx.id)}">
          <span class="mini-ic" style="--tx-color:${esc(cat.color)}">
            <i class="ic" data-ic="${esc(cat.icon)}" data-glyph="${esc(cat.glyph)}"></i>
          </span>

          <span class="mini-main">
            <span class="mini-name">${esc(tx.merchant || cat.name)}</span>
            <span class="mini-meta">${meta}</span>
          </span>

          <span class="mini-amount ${esc(tx.type)}">
            ${esc(signedMoney(tx.amount, tx.type))}
          </span>
        </button>
      `;
    }

    function openAccountDetails(id) {

      modal.innerHTML = `
        <div class="m-head">
          <h3 id="modalTitle">${esc(acc.name)}</h3>
          <button type="button" class="m-close" id="mClose" aria-label="Закрыть">✕</button>

            <div class="d-row">
              <span>Тип</span>

            <div class="d-row">
              <span>Номер</span>
              <span>${esc(acc.masked || '—')}</span>

            </div>

            <div class="acc-stat">

            </div>

            <div class="acc-stat inc">
              <span>Приход</span>
              <strong>+${esc(money(stats.income))}</strong>
            </div>

            <div class="acc-stat exp">
              <span>Расход</span>
              <strong>−${esc(money(stats.expense))}</strong>
            </div>
          </div>

          <div class="recent-title">Последние операции</div>

          <div class="recent-list">
            ${stats.recent.length ? stats.recent.map(miniTransactionHTML).join('') : '<div class="empty-state">Пока нет операций</div>'}
