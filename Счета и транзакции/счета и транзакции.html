        <div class="form-foot">
          <button type="button" class="btn primary" data-action="add-tx">＋ Операция</button>
          <button type="button" class="btn" data-action="filter">Фильтр</button>
          <button type="button" class="btn" data-action="edit">Изменить</button>
          <button type="button" class="btn danger" data-action="delete">Удалить</button>
        </div>
      `;

      backdrop.hidden = false;
      document.body.style.overflow = 'hidden';
      syncTelegramBackButton();
      hydrateIcons(modal);

      $('#mClose').onclick = closeModal;

      $$('[data-action]', modal).forEach(btn => {
        btn.onclick = () => {
          const action = btn.dataset.action;

          if (action === 'add-tx') {
            closeModal();
            openAddModal({ accountId: id });
            return;
          }

          if (action === 'filter') {
            state.accountId = id;
            closeModal();
            renderAll();
            $('#txList')?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
            haptic('light');
            return;
          }

          if (action === 'edit') {
            closeModal();
            openAccountModal(id);
            return;
          }

          if (action === 'delete') {
            if (stats.allCount > 0) {
              toast('Нельзя удалить счёт, по которому есть операции');
              haptic('error');
              return;
            }

            if (!window.confirm('Удалить счёт?')) return;

            state.accounts = state.accounts.filter(a => a.id !== id);
            if (state.accountId === id) state.accountId = null;

            closeModal();
            renderAll();
            haptic('success');
            toast('Счёт удалён');
          }
        };
      });

      $$('.mini-tx', modal).forEach(btn => {
        btn.onclick = () => {
          const txId = btn.dataset.tx;
          closeModal();
          openTransactionDetails(txId);
        };
      });
    }

    /* ====== ADD TRANSACTION MODAL ====== */

    const addState = {
      type: 'expense'
    };

    function accountOptionsHTML(selected, excludeId = null) {
      return state.accounts.map(acc => `
        <option value="${esc(acc.id)}"${acc.id === selected && acc.id !== excludeId ? ' selected' : ''}>
          ${esc(acc.name)} · ${esc(acc.masked || '')}
        </option>
      `).join('');
    }

    function addCategoryOptionsHTML(kind, selected) {
      const items = Object.entries(CATEGORIES)
        .filter(([, c]) => c.kind === kind)
        .sort((a, b) => a[1].name.localeCompare(b[1].name, 'ru'));

      return items.map(([id, c]) => `
        <option value="${esc(id)}"${id === selected ? ' selected' : ''}>${esc(c.name)}</option>
      `).join('');
    }

    function refreshTransferToOptions() {
      const fromEl = $('#tmAccount');
      const toEl = $('#tmToAccount');
      if (!fromEl || !toEl) return;

      const fromId = fromEl.value;
      const currentTo = toEl.value;
      toEl.innerHTML = accountOptionsHTML(currentTo && currentTo !== fromId ? currentTo : state.accounts.find(a => a.id !== fromId)?.id, fromId);
    }

    function openAddModal(prefill = {}) {
      lastFocused = document.activeElement;
      addState.type = prefill.type || 'expense';

      const defaultAccountId = prefill.accountId || state.accounts[0]?.id || '';

      modal.innerHTML = `
        <div class="m-head">
          <h3 id="modalTitle">Новая операция</h3>
          <button type="button" class="m-close" id="mClose" aria-label="Закрыть">✕</button>
        </div>

        <div class="m-body">
          <div class="form-grid">
            <div class="field">
              <label>Тип</label>
              <div class="type-seg" id="tmType" role="group" aria-label="Тип операции">
                <button type="button" data-type="expense" class="${addState.type === 'expense' ? 'on' : ''}">Расход</button>
                <button type="button" data-type="income" class="${addState.type === 'income' ? 'on' : ''}">Доход</button>
                <button type="button" data-type="transfer" class="${addState.type === 'transfer' ? 'on' : ''}">Перевод</button>
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="tmAmount">Сумма, ₽</label>
                <input id="tmAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="Например, 1250" value="${prefill.amount || ''}" />
              </div>

              <div class="field">
                <label for="tmDate">Дата</label>
                <input id="tmDate" type="date" value="${esc(prefill.date || TODAY_KEY)}" min="2020-01-01" max="2100-12-31" />
              </div>
            </div>

            <div class="field">
              <label for="tmAccount">${addState.type === 'transfer' ? 'Откуда' : 'Счёт'}</label>
              <select id="tmAccount">
                ${accountOptionsHTML(defaultAccountId)}
              </select>
            </div>

            <div class="field" id="tmToField" hidden>
              <label for="tmToAccount">Куда</label>
              <select id="tmToAccount"></select>
            </div>

            <div class="field" id="tmCategoryField">
              <label for="tmCategory">Категория</label>
              <select id="tmCategory">
                ${addCategoryOptionsHTML(addState.type === 'income' ? 'income' : 'expense', addState.type === 'income' ? 'salary' : 'food')}
              </select>
            </div>

            <div class="field">
              <label for="tmMerchant">Партнёр / название</label>
              <input
                id="tmMerchant"
                type="text"
                maxlength="120"
                placeholder="${addState.type === 'transfer' ? 'Например: перевод себе' : addState.type === 'income' ? 'Например: зарплата, кэшбэк' : 'Например: Пятёрочка, такси'}"
                value="${esc(prefill.merchant || '')}"
                autocomplete="off"
              />
            </div>

            <div class="field">
              <label for="tmNote">Заметка</label>
              <textarea id="tmNote" maxlength="300" placeholder="Необязательно">${esc(prefill.note || '')}</textarea>
            </div>
          </div>
        </div>

        <div class="form-foot">
          <button type="button" class="btn" id="tmCancel">Отмена</button>
          <button type="button" class="btn primary" id="tmSave">Сохранить</button>
        </div>
      `;

      backdrop.hidden = false;
      document.body.style.overflow = 'hidden';
      syncTelegramBackButton();
      hydrateIcons(modal);

      $('#mClose').onclick = closeModal;
      $('#tmCancel').onclick = closeModal;
      $('#tmSave').onclick = saveNewTransaction;

      $('#tmType').addEventListener('click', e => {
        const btn = e.target.closest('[data-type]');
        if (!btn) return;

        addState.type = btn.dataset.type;

        $$('#tmType button').forEach(b => {
          b.classList.toggle('on', b.dataset.type === addState.type);
        });

        const isTransfer = addState.type === 'transfer';
        const isIncome = addState.type === 'income';

        $('#tmToField').hidden = !isTransfer;
        $('#tmCategoryField').hidden = isTransfer;

        const accountLabel = $('#tmAccount').previousElementSibling;
        if (accountLabel) {
          accountLabel.textContent = isTransfer ? 'Откуда' : 'Счёт';
        }

        const catSelect = $('#tmCategory');
        if (catSelect) {
          catSelect.innerHTML = addCategoryOptionsHTML(isIncome ? 'income' : 'expense', isIncome ? 'salary' : 'food');
        }

        const merchant = $('#tmMerchant');
        if (merchant) {
          merchant.placeholder = isTransfer
            ? 'Например: перевод себе, оплата долга'
            : isIncome
              ? 'Например: зарплата, кэшбэк'
              : 'Например: Пятёрочка, такси, подписка';
        }

        if (isTransfer) refreshTransferToOptions();
      });

      $('#tmAccount').addEventListener('change', () => {
        if (addState.type === 'transfer') refreshTransferToOptions();
      });

      if (addState.type === 'transfer') refreshTransferToOptions();

      $('#tmAmount').focus();
    }

    function saveNewTransaction() {
      clearInvalid();

      const amountEl = $('#tmAmount');
      const dateEl = $('#tmDate');
      const accountEl = $('#tmAccount');
      const toAccountEl = $('#tmToAccount');
      const categoryEl = $('#tmCategory');
      const merchantEl = $('#tmMerchant');
      const noteEl = $('#tmNote');

      if (!amountEl || !dateEl || !accountEl || !merchantEl) return;

      const amount = Math.round(Number(amountEl.value) || 0);
      if (!Number.isFinite(amount) || amount <= 0) {
        markInvalid(amountEl);
        toast('Укажите сумму');
        haptic('error');
        return;
      }

      const date = dateEl.value;
      if (!date || Number.isNaN(parseKey(date).getTime())) {
        markInvalid(dateEl);
        toast('Укажите дату');
        haptic('error');
        return;
      }

      const accountId = accountEl.value;
      if (!accountById(accountId)) {
        markInvalid(accountEl);
        toast('Выберите счёт');
        haptic('error');
        return;
      }

      const type = addState.type;
      let toAccountId = null;

      if (type === 'transfer') {
        toAccountId = toAccountEl?.value || '';
        if (!accountById(toAccountId)) {
          markInvalid(toAccountEl);
          toast('Выберите счёт назначения');
          haptic('error');
          return;
        }

        if (toAccountId === accountId) {
          markInvalid(toAccountEl);
          toast('Счета должны отличаться');
          haptic('error');
          return;
        }
      }

      const categoryId = type === 'transfer'
        ? 'transfer'
        : (categoryEl?.value in CATEGORIES ? categoryEl.value : (type === 'income' ? 'other_income' : 'other_expense'));

      const merchant = merchantEl.value.trim() || CATEGORIES[categoryId].name;
      const note = noteEl?.value.trim() || '';

      const tx = {
        id: 'tx' + Date.now().toString(36),
        date,
        type,
        amount,
        categoryId,
        accountId,
        toAccountId,
        merchant,
        note
      };

      applyTransactionToBalances(tx, 1);
      state.transactions.unshift(tx);

      closeModal();
      renderAll();
      haptic('success');
      toast('Операция добавлена');
    }

    /* ====== TRANSACTION DETAILS ====== */

    function openTransactionDetails(txId) {
      const tx = state.transactions.find(x => x.id === txId);
      if (!tx) return;

      lastFocused = document.activeElement;

      const cat = categoryById(tx.categoryId);
      const acc = accountById(tx.accountId);
      const to = tx.toAccountId ? accountById(tx.toAccountId) : null;
      const d = parseKey(tx.date);

      const accountText = tx.type === 'transfer'
        ? `${esc(acc?.name || '—')} → ${esc(to?.name || '—')}`
        : esc(acc?.name || '—');

      modal.innerHTML = `
        <div class="m-head">
          <h3 id="modalTitle">Операция</h3>
          <button type="button" class="m-close" id="mClose" aria-label="Закрыть">✕</button>
        </div>

        <div class="m-body">
          <div class="details-hero">
            <span class="details-ic" style="--tx-color:${esc(cat.color)}">
              <i class="ic" data-ic="${esc(cat.icon)}" data-glyph="${esc(cat.glyph)}"></i>
            </span>

            <div class="details-title">
              <div class="details-name">${esc(tx.merchant || cat.name)}</div>
              <div class="details-sub">${esc(formatFullDate(d))}</div>
            </div>

            <div class="details-amount ${esc(tx.type)}">
              ${esc(signedMoney(tx.amount, tx.type))}
            </div>
          </div>

          <div class="details-rows">
            <div class="d-row">
              <span>Тип</span>
              <span>${esc(tx.type === 'income' ? 'Доход' : tx.type === 'expense' ? 'Расход' : 'Перевод')}</span>
            </div>

            <div class="d-row">
              <span>Категория</span>
              <span>${esc(cat.name)}</span>
            </div>

            <div class="d-row">
              <span>Счёт</span>
              <span>${accountText}</span>
            </div>

            ${tx.note ? `
              <div class="d-row">
                <span>Заметка</span>
                <span>${esc(tx.note)}</span>
              </div>
            ` : ''}

            <div class="d-row">
              <span>ID</span>
              <span>${esc(tx.id)}</span>
            </div>
          </div>
        </div>

        <div class="form-foot">
          <button type="button" class="btn primary" id="tdDuplicate">Повторить</button>
          <button type="button" class="btn danger" id="tdDelete">Удалить</button>
          <button type="button" class="btn" id="tdClose">Закрыть</button>
        </div>
      `;

      backdrop.hidden = false;
      document.body.style.overflow = 'hidden';
      syncTelegramBackButton();
      hydrateIcons(modal);

      $('#mClose').onclick = closeModal;
      $('#tdClose').onclick = closeModal;

      $('#tdDuplicate').onclick = () => {
        const copy = {
          ...tx,
          id: 'tx' + Date.now().toString(36),
          date: TODAY_KEY
        };

        if (!accountById(copy.accountId) || (copy.toAccountId && !accountById(copy.toAccountId))) {
          toast('Счёт для повтора недоступен');
          haptic('error');
          return;
        }

        applyTransactionToBalances(copy, 1);
        state.transactions.unshift(copy);

        closeModal();
        renderAll();
        haptic('success');
        toast('Операция повторена');
      };

      $('#tdDelete').onclick = () => {
        if (!window.confirm('Удалить операцию? Балансы будут пересчитаны.')) return;

        applyTransactionToBalances(tx, -1);
        state.transactions = state.transactions.filter(x => x.id !== tx.id);

        closeModal();
        renderAll();
        haptic('success');
        toast('Операция удалена');
      };
    }

    /* ====== TOAST / HAPTIC ====== */

    function toast(text) {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('show');

      clearTimeout(window.__tt);
      window.__tt = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function haptic(type = 'light') {
      try {
        if (tg?.HapticFeedback) {
          if (type === 'success') {
            tg.HapticFeedback.notificationOccurred('success');
          } else if (type === 'error') {
            tg.HapticFeedback.notificationOccurred('error');
          } else {
            tg.HapticFeedback.impactOccurred(type === 'light' ? 'light' : type);
          }
          return;
        }
      } catch (_) {}

      if (navigator.vibrate) {
        navigator.vibrate(type === 'success' ? 20 : type === 'error' ? 30 : 10);
      }
    }

    /* ====== THEME ====== */

    function currentTheme() {
      return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    }

    function syncTelegramChrome() {
      if (!tg) return;

      const dark = currentTheme() === 'dark';
      const bg = dark ? '#0f1220' : '#f5f6fa';

      try {
        tg.setHeaderColor?.(bg);
        tg.setBackgroundColor?.(bg);
      } catch (_) {}
    }

    function setTheme(theme, save = true) {
      document.documentElement.dataset.theme = theme;
      if (save) storeSet('domkniga-accounts-v2-theme', theme);

      const themeBtn = $('#themeBtn');
      themeBtn.textContent = theme === 'dark' ? '☀️' : '◐';
      themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему');

      syncTelegramChrome();
    }

    $('#themeBtn').addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      setTheme(next, true);
      renderAll();
      haptic('light');
    });

    /* ====== HIDE SUMS ====== */

    const hideBtn = $('#hideBtn');

    function syncHideButton() {
      hideBtn.textContent = state.hidden ? '👁' : '🙈';
      hideBtn.setAttribute('aria-pressed', state.hidden ? 'true' : 'false');
      hideBtn.setAttribute('aria-label', state.hidden ? 'Показать суммы' : 'Скрыть суммы');
      hideBtn.title = state.hidden ? 'Показать суммы' : 'Скрыть суммы';
    }

    hideBtn.addEventListener('click', () => {
      state.hidden = !state.hidden;
      storeSet('domkniga-accounts-v2-hidden', state.hidden ? '1' : '0');

      syncHideButton();
      renderAll();
      haptic('light');
    });

    /* ====== EVENTS: CAROUSEL ====== */

    const carousel = $('#accountsCarousel');

    let carPointer = {
      active: false,
      x: 0,
      moved: false
    };

    carousel.addEventListener('pointerdown', e => {
      carPointer.active = true;
      carPointer.x = e.clientX;
      carPointer.moved = false;
    });

    window.addEventListener('pointermove', e => {
      if (!carPointer.active) return;
      if (Math.abs(e.clientX - carPointer.x) > 10) {
        carPointer.moved = true;
      }
    });

    window.addEventListener('pointerup', () => {
      if (!carPointer.active) return;

      if (carPointer.moved) {
        justCarouselDragged = true;
        setTimeout(() => {
          justCarouselDragged = false;
        }, 220);
      }

      carPointer.active = false;
      carPointer.moved = false;
    });

    carousel.addEventListener('scroll', () => {
      updateCarouselState();
    }, { passive: true });

    carousel.addEventListener('click', e => {
      if (justCarouselDragged) return;

      const card = e.target.closest('[data-account]');
      if (!card) return;

      openAccountDetails(card.dataset.account);
      haptic('light');
    });

    $('#accountsPrev').addEventListener('click', () => {
      scrollAccountsByPages(-1);
      haptic('light');
    });

    $('#accountsNext').addEventListener('click', () => {
      scrollAccountsByPages(1);
      haptic('light');
    });

    $('#accountsDots').addEventListener('click', e => {
      const btn = e.target.closest('[data-page]');
      if (!btn) return;

      scrollToAccountPage(Number(btn.dataset.page));
      haptic('light');
    });

    $('#addAccountBtn').addEventListener('click', () => {
      openAccountModal();
      haptic('light');
    });

    /* ====== EVENTS: TRANSACTIONS ====== */

    $('#addBtn').addEventListener('click', () => {
      openAddModal();
      haptic('light');
    });

    $('#typeSeg').addEventListener('click', e => {
      const btn = e.target.closest('[data-type]');
      if (!btn) return;

      state.type = btn.dataset.type;
      renderAll();
      haptic('light');
    });

    $('#periodSeg').addEventListener('click', e => {
      const btn = e.target.closest('[data-period]');
      if (!btn) return;

      state.period = btn.dataset.period;
      renderAll();
      haptic('light');
    });

    $('#categorySelect').addEventListener('change', e => {
      state.categoryId = e.target.value;
      renderAll();
      haptic('light');
    });

    $('#searchInput').addEventListener('input', e => {
      state.query = e.target.value;
      renderTransactionsOnly();
    });

    $('#searchClear').addEventListener('click', () => {
      state.query = '';
      $('#searchInput').value = '';
      renderAll();
      $('#searchInput').focus();
      haptic('light');
    });

    $('#chips').addEventListener('click', e => {
      const btn = e.target.closest('[data-clear]');
      if (!btn) return;

      const clear = btn.dataset.clear;

      if (clear === 'account') state.accountId = null;
      if (clear === 'category') {
        state.categoryId = '';
        $('#categorySelect').value = '';
      }
      if (clear === 'type') state.type = 'all';

      renderAll();
      haptic('light');
    });

    $('#txList').addEventListener('click', e => {
      const row = e.target.closest('[data-tx]');
      if (!row) return;

      openTransactionDetails(row.dataset.tx);
      haptic('light');
    });

    /* ====== KEYBOARD ====== */

    document.addEventListener('keydown', e => {
      if (!backdrop.hidden) return;

      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        scrollAccountsByPages(-1);
        haptic('light');
      }

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        scrollAccountsByPages(1);
        haptic('light');
      }
    });

    /* ====== RESIZE ====== */

    let resizeTimer = 0;

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        updateCarouselState();
      }, 120);
    });

    /* ====== INIT ====== */

    const storedTheme = storeGet('domkniga-accounts-v2-theme');

    if (storedTheme === 'dark' || storedTheme === 'light') {
      setTheme(storedTheme, false);
    } else if (tg?.colorScheme) {
      setTheme(tg.colorScheme === 'dark' ? 'dark' : 'light', false);
    } else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      setTheme('dark', false);
    }

    (function initTelegram() {
      if (!tg) return;

      try {
        tg.ready();
        tg.expand();
      } catch (_) {}
    })();

    buildCategoryOptions();
    syncHideButton();
    renderAll();
    syncTelegramChrome();
    syncTelegramBackButton();
  </script>
</body>
</html>
